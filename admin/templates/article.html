        <script>
            // 文章页面特定的JavaScript
            document.addEventListener('DOMContentLoaded', function() {
                // 说明：发布时间筛选已改用浏览器原生日期控件（type="date"），
                // 不再初始化 BlogKitAdvanced.DatePicker 自定义年份选择器

                // 获取筛选表单元素
                const categoryFilter = document.getElementById('category_filter');
                const statusFilter = document.getElementById('status_filter');
                const topTypeFilter = document.getElementById('top_type_filter');
                const searchFilter = document.getElementById('search_filter');
                const filterBtn = document.getElementById('filter-btn');
                const resetBtn = document.getElementById('reset-btn');
                
                // 重置按钮点击事件
                if (resetBtn) {
                    resetBtn.addEventListener('click', function() {
                        // 跳转到指定URL重置筛选
                        window.location.href = '/admin.php?action=article&sub=list';
                    });
                }
                
                // 表单提交时处理空参数
                const form = document.querySelector('form');
                const dateFromFilter = document.getElementById('date_from');
                const dateToFilter = document.getElementById('date_to');
                
                if (form) {
                    form.addEventListener('submit', function(e) {
                        if (categoryFilter && categoryFilter.value === '') {
                            categoryFilter.removeAttribute('name');
                        }
                        if (statusFilter && statusFilter.value === '') {
                            statusFilter.removeAttribute('name');
                        }
                        if (topTypeFilter && topTypeFilter.value === '') {
                            topTypeFilter.removeAttribute('name');
                        }
                        if (searchFilter && searchFilter.value.trim() === '') {
                            searchFilter.removeAttribute('name');
                        }
                        if (dateFromFilter && dateFromFilter.value === '') {
                            dateFromFilter.removeAttribute('name');
                        }
                        if (dateToFilter && dateToFilter.value === '') {
                            dateToFilter.removeAttribute('name');
                        }
                    });
                }
                
                // 全选/取消全选
                const selectAll = document.getElementById('select_all');
                if (selectAll) {
                    selectAll.addEventListener('change', function() {
                        var checkboxes = document.querySelectorAll('.article_checkbox');
                        checkboxes.forEach(function(checkbox) {
                            checkbox.checked = selectAll.checked;
                            checkbox.closest('tr').classList.toggle('selected', selectAll.checked);
                        });
                    });
                }
                
                // 单选时高亮行
                document.querySelectorAll('.article_checkbox').forEach(function(cb) {
                    cb.addEventListener('change', function(e) {
                        e.target.closest('tr').classList.toggle('selected', e.target.checked);
                    });
                });
                
                // 批量操作
                const executeBatch = document.getElementById('execute_batch');
                const batchAction = document.getElementById('batch_action');
                const moveCategory = document.getElementById('move_category');
                const batchTagsDiv = document.getElementById('batch_tags');
                
                // 监听批量操作选择变化
                    if (batchAction) {
                    batchAction.addEventListener('change', function() {
                        if (this.value === 'move') {
                            moveCategory.style.display = 'inline-block';
                            batchTagsDiv.style.display = 'none';
                        } else if (this.value === 'tags') {
                            moveCategory.style.display = 'none';
                            batchTagsDiv.style.display = 'inline-block';
                        } else {
                            moveCategory.style.display = 'none';
                            batchTagsDiv.style.display = 'none';
                        }
                    });
                }
                
                // 批量操作执行
                if (executeBatch) {
                    executeBatch.addEventListener('click', function() {
                        if (!batchAction) return;
                        
                        var action = batchAction.value;
                        var checkboxes = document.querySelectorAll('.article_checkbox:checked');
                        var ids = [];
                        
                        checkboxes.forEach(function(checkbox) {
                            ids.push(checkbox.value);
                        });
                        
                        if (!action || ids.length === 0) {
                            showToast('请选择操作和文章', 'error');
                            return;
                        }
                        
                        // 批量置顶操作
                        if (action.startsWith('top-')) {
                            var topType = parseInt(action.split('-')[1]);
                            
                            // 创建表单并提交
                            var form = document.createElement('form');
                            form.method = 'POST';
                            form.action = 'admin.php?action=article&method=batchTop';
                            
                            // 添加文章ID
                            ids.forEach(function(id) {
                                var input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = 'ids[]';
                                input.value = id;
                                form.appendChild(input);
                            });
                            
                            // 添加置顶类型
                            var topTypeInput = document.createElement('input');
                            topTypeInput.type = 'hidden';
                            topTypeInput.name = 'top_type';
                            topTypeInput.value = topType;
                            form.appendChild(topTypeInput);
                            
                            // 添加CSRF令牌
                            var tokenInput = document.createElement('input');
                            tokenInput.type = 'hidden';
                            tokenInput.name = 'csrf_token';
                            tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
                            form.appendChild(tokenInput);
                            
                            // 提交表单
                            document.body.appendChild(form);
                            form.submit();
                        }
                        // 批量删除操作
                        else if (action === 'delete') {
                            if (confirm('确定要删除选中的文章吗？')) {
                                // 创建表单并提交
                                var form = document.createElement('form');
                                form.method = 'POST';
                                form.action = 'admin.php?action=article&method=batchDelete';
                                
                                // 添加文章ID
                                ids.forEach(function(id) {
                                    var input = document.createElement('input');
                                    input.type = 'hidden';
                                    input.name = 'ids[]';
                                    input.value = id;
                                    form.appendChild(input);
                                });
                                
                                // 添加CSRF令牌
                                var tokenInput = document.createElement('input');
                                tokenInput.type = 'hidden';
                                tokenInput.name = 'csrf_token';
                                tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
                                form.appendChild(tokenInput);
                                
                                // 提交表单
                                document.body.appendChild(form);
                                form.submit();
                            }
                        }
                        // 批量修改状态操作
                        else if (action.startsWith('status-')) {
                            var status = parseInt(action.split('-')[1]);
                            
                            // 创建表单并提交
                            var form = document.createElement('form');
                            form.method = 'POST';
                            form.action = 'admin.php?action=article&method=batchStatus';
                            
                            // 添加文章ID
                            ids.forEach(function(id) {
                                var input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = 'ids[]';
                                input.value = id;
                                form.appendChild(input);
                            });
                            
                            // 添加状态值
                            var statusInput = document.createElement('input');
                            statusInput.type = 'hidden';
                            statusInput.name = 'status';
                            statusInput.value = status;
                            form.appendChild(statusInput);
                            
                            // 添加CSRF令牌
                            var tokenInput = document.createElement('input');
                            tokenInput.type = 'hidden';
                            tokenInput.name = 'csrf_token';
                            tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
                            form.appendChild(tokenInput);
                            
                            // 提交表单
                            document.body.appendChild(form);
                            form.submit();
                        }
                        // 批量移动分类操作
                        else if (action === 'move') {
                            var targetCategory = document.getElementById('target_category');
                            var categoryId = targetCategory.value;
                            
                            if (!categoryId) {
                                showToast('请选择目标分类', 'error');
                                return;
                            }
                            
                            // 创建表单并提交
                            var form = document.createElement('form');
                            form.method = 'POST';
                            form.action = 'admin.php?action=article&method=batchMove';
                            
                            // 添加文章ID
                            ids.forEach(function(id) {
                                var input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = 'ids[]';
                                input.value = id;
                                form.appendChild(input);
                            });
                            
                            // 添加目标分类ID
                            var categoryInput = document.createElement('input');
                            categoryInput.type = 'hidden';
                            categoryInput.name = 'category_id';
                            categoryInput.value = categoryId;
                            form.appendChild(categoryInput);
                            
                            // 添加CSRF令牌
                            var tokenInput = document.createElement('input');
                            tokenInput.type = 'hidden';
                            tokenInput.name = 'csrf_token';
                            tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
                            form.appendChild(tokenInput);
                            
                            // 提交表单
                            document.body.appendChild(form);
                            form.submit();
                        }
                        // 批量修改标签操作
                        else if (action === 'tags') {
                            var tagsInput = document.getElementById('batch_tags_input');
                            var tagMode = document.getElementById('tag_mode');
                            var tags = tagsInput.value.trim();
                            
                            if (!tags) {
                                showToast('请输入要设置的标签', 'error');
                                return;
                            }
                            
                            var form = document.createElement('form');
                            form.method = 'POST';
                            form.action = 'admin.php?action=article&method=batchTags';
                            
                            ids.forEach(function(id) {
                                var input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = 'ids[]';
                                input.value = id;
                                form.appendChild(input);
                            });
                            
                            var tagsInputField = document.createElement('input');
                            tagsInputField.type = 'hidden';
                            tagsInputField.name = 'tags';
                            tagsInputField.value = tags;
                            form.appendChild(tagsInputField);
                            
                            var modeInput = document.createElement('input');
                            modeInput.type = 'hidden';
                            modeInput.name = 'tag_mode';
                            modeInput.value = tagMode.value;
                            form.appendChild(modeInput);
                            
                            var tokenInput = document.createElement('input');
                            tokenInput.type = 'hidden';
                            tokenInput.name = 'csrf_token';
                            tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
                            form.appendChild(tokenInput);
                            
                            document.body.appendChild(form);
                            form.submit();
                        }
                    });
                }
            });
        </script>
    </div>
