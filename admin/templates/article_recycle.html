    <script>
    // ==================== 回收站批量操作（对齐文章列表页交互） ====================
    // 说明：批量还原/批量彻底删除端点（batchRestore/batchForceDelete）执行后
    // 重定向回回收站页，因此这里采用与文章列表页相同的「构建隐藏表单整页 POST」方式提交。
    document.addEventListener('DOMContentLoaded', function() {
        // 收集当前勾选的文章 ID 列表（行复选框统一命名 ids[]）
        const getRecycleSelectedIds = () =>
            Array.from(document.querySelectorAll('input[name="ids[]"]:checked')).map((cb) => cb.value);

        // 统一构建 POST 表单并提交（ids[] + 额外参数 + CSRF 令牌），与文章列表页 submitBatchForm 一致
        const submitRecycleBatchForm = (url, params) => {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = url;
            getRecycleSelectedIds().forEach((id) => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'ids[]';
                input.value = id;
                form.appendChild(input);
            });
            Object.keys(params).forEach((key) => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = params[key];
                form.appendChild(input);
            });
            const tokenInput = document.createElement('input');
            tokenInput.type = 'hidden';
            tokenInput.name = 'csrf_token';
            tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
            form.appendChild(tokenInput);
            document.body.appendChild(form);
            form.submit();
        };

        // 全选/取消全选：与行内复选框状态联动，并同步行高亮
        const recycleSelectAll = document.getElementById('select_all');
        if (recycleSelectAll) {
            recycleSelectAll.addEventListener('change', function() {
                document.querySelectorAll('input[name="ids[]"]').forEach(function(cb) {
                    cb.checked = recycleSelectAll.checked;
                    cb.closest('tr').classList.toggle('selected', cb.checked);
                });
            });
        }

        // 单选时高亮行（tables.css 的 tr.selected 样式）
        document.querySelectorAll('input[name="ids[]"]').forEach(function(cb) {
            cb.addEventListener('change', function() {
                cb.closest('tr').classList.toggle('selected', cb.checked);
            });
        });

        // 批量菜单点击分发：还原走 batchRestore；彻底删除为不可恢复的危险操作，强确认后提交
        document.querySelectorAll('.batch-menu a[data-batch]').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const action = this.getAttribute('data-batch');
                if (getRecycleSelectedIds().length === 0) {
                    showToast('请先选择文章', 'error');
                    return;
                }
                if (action === 'restore') {
                    // 批量还原：普通确认即可
                    showConfirmDialog('确定要还原选中的文章吗？', { type: 'info', title: '批量操作', confirmText: '还原' }).then(function(ok) {
                        if (ok) submitRecycleBatchForm('admin.php?action=article&method=batchRestore', {});
                    });
                } else if (action === 'force-delete') {
                    // 批量彻底删除：危险操作强确认（红色样式确认弹窗，物理删除不可恢复）
                    showConfirmDialog('确定要彻底删除选中的文章吗？此操作不可恢复。', { type: 'danger', confirmText: '彻底删除' }).then(function(ok) {
                        if (ok) submitRecycleBatchForm('admin.php?action=article&method=batchForceDelete', {});
                    });
                }
            });
        });
    });
    </script>
