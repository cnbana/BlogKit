        <script>
            // 评论页面特定的JavaScript
            // 获取筛选表单元素
            const statusFilter = document.getElementById('status_filter');
            const searchFilter = document.getElementById('search_filter');
            const filterBtn = document.getElementById('filter-btn');
            const resetBtn = document.getElementById('reset-btn');
            
            // 重置按钮点击事件
            resetBtn.addEventListener('click', function() {
                // 跳转到指定URL重置筛选
                window.location.href = '/admin.php?action=comment';
            });
            
            // 表单提交时处理空参数
            document.querySelector('form').addEventListener('submit', function(e) {
                if (statusFilter.value === '') {
                    statusFilter.removeAttribute('name');
                }
                if (searchFilter.value.trim() === '') {
                    searchFilter.removeAttribute('name');
                }
            });
            
            // 操作按钮点击事件
            document.addEventListener('click', function(e) {
                const target = e.target;
                const action = target.getAttribute('data-action');
                const id = target.getAttribute('data-id');

                if (action && id) {
                    let message = '';
                    let confirmText = '';
                    let url = '';

                    switch(action) {
                        case 'approve':
                            message = '确定要通过审核吗？';
                            confirmText = '通过';
                            url = 'admin.php?action=comment&sub=toggleStatus&id=' + id + '&status=1';
                            break;
                        case 'reject':
                            message = '确定要设为待审核吗？';
                            confirmText = '设为待审';
                            url = 'admin.php?action=comment&sub=toggleStatus&id=' + id + '&status=0';
                            break;
                        case 'delete':
                            message = '确定要删除这条评论吗？';
                            confirmText = '删除';
                            url = 'admin.php?action=comment&sub=delete&id=' + id;
                            break;
                        case 'toggleTop':
                            const isTop = target.getAttribute('data-is-top') === '1';
                            message = isTop ? '确定要取消置顶吗？' : '确定要置顶吗？';
                            confirmText = isTop ? '取消置顶' : '置顶';
                            url = 'admin.php?action=comment&sub=toggleTop&id=' + id;
                            break;
                        case 'edit':
                            // 编辑评论：在右侧抽屉内打开编辑表单（common.js 通用 openEntityDrawer，保留列表上下文）
                            openEntityDrawer('admin.php?action=comment&sub=edit&id=' + id, '编辑评论');
                            return;
                    }

                    if (message && url) {
                        e.preventDefault();
                        // 统一确认弹窗（common.js 的 showConfirmDialog，按钮文案 = 具体动作）
                        showConfirmDialog(message, { confirmText: confirmText }).then(function(confirmed) {
                            if (confirmed) {
                                window.location.href = url;
                            }
                        });
                    }
                }
            });
        </script>

    <script>
    // ==================== 评论批量操作（对齐文章列表页交互） ====================
    // 说明：评论控制器的批量端点（batchUpdateStatus/batchDelete）返回 JSON 响应，
    // 因此这里用 fetch 提交并根据响应弹出 toast 后刷新列表，
    // 避免表单整页提交导致浏览器直接渲染裸 JSON 文本。
    document.addEventListener('DOMContentLoaded', function() {
        // 收集当前勾选的评论 ID 列表（行复选框统一命名 ids[]）
        const getBatchSelectedIds = () =>
            Array.from(document.querySelectorAll('input[name="ids[]"]:checked')).map((cb) => cb.value);

        // 统一 POST 提交（ids[] + 额外参数 + CSRF 令牌），成功后延迟刷新让用户看到提示
        const submitBatchJson = (url, params) => {
            const body = new URLSearchParams();
            getBatchSelectedIds().forEach((id) => body.append('ids[]', id));
            Object.keys(params).forEach((key) => body.append(key, params[key]));
            body.append('csrf_token', '<?php echo $_SESSION['csrf_token']; ?>');
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: body.toString()
            })
                .then((res) => res.json())
                .then((res) => {
                    showToast(res.msg || (res.code === 200 ? '操作成功' : '操作失败'), res.code === 200 ? 'success' : 'error');
                    if (res.code === 200) {
                        setTimeout(() => window.location.reload(), 800);
                    }
                })
                .catch(() => showToast('请求失败，请重试', 'error'));
        };

        // 全选/取消全选：与行内复选框状态联动，并同步行高亮
        const batchSelectAll = document.getElementById('select_all');
        if (batchSelectAll) {
            batchSelectAll.addEventListener('change', function() {
                document.querySelectorAll('input[name="ids[]"]').forEach(function(cb) {
                    cb.checked = batchSelectAll.checked;
                    cb.closest('tr').classList.toggle('selected', cb.checked);
                });
            });
        }

        // 单选时高亮行（tables.css 的 tr.selected 样式）
        document.querySelectorAll('input[name="ids[]"]').forEach(function(cb) {
            cb.addEventListener('change', function() {
                cb.closest('tr').classList.toggle('selected', cb.checked);
            });
        });

        // 批量菜单点击分发：审核通过/设为待审走 batchUpdateStatus（status=1/0），删除走 batchDelete
        document.querySelectorAll('.batch-menu a[data-batch]').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const action = this.getAttribute('data-batch');
                if (getBatchSelectedIds().length === 0) {
                    showToast('请先选择评论', 'error');
                    return;
                }
                if (action === 'approve') {
                    // 批量审核通过（status=1，控制器内部会触发审核通过通知）
                    submitBatchJson('admin.php?action=comment&sub=batchUpdateStatus', { status: 1 });
                } else if (action === 'pending') {
                    // 批量设为待审核（status=0）
                    submitBatchJson('admin.php?action=comment&sub=batchUpdateStatus', { status: 0 });
                } else if (action === 'delete') {
                    // 批量删除：危险操作强确认（红色样式确认弹窗）
                    showConfirmDialog('确定要删除选中的评论吗？', { type: 'danger', confirmText: '删除' }).then(function(ok) {
                        if (ok) submitBatchJson('admin.php?action=comment&sub=batchDelete', {});
                    });
                }
            });
        });
    });
    </script>
