<!-- 页面专属样式已并入 assets/css/components.css -->

<script>
function saveComment() {
    var form = document.getElementById('comment-form');
    var content = document.getElementById('content').value.trim();

    if (!content) {
        // 统一提示气泡（common.js 的 showToast），替代原生 alert
        showToast('评论内容不能为空', 'warning');
        return;
    }

    // 使用 AJAX 提交
    var formData = new FormData(form);

    fetch('admin.php?action=comment&sub=update', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            showToast(data.msg || '保存成功', 'success');
            // 保存成功后跳回评论列表（若在编辑抽屉 iframe 内，common.js 会检测到
            // 跳回列表并自动关闭抽屉、刷新父页面列表）
            window.location.href = 'admin.php?action=comment';
        } else {
            showToast(data.msg || '保存失败', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showToast('请求失败，请检查网络后重试', 'error');
    });
}
</script>
