<script>
function saveComment() {
    var form = document.getElementById('comment-form');
    var content = document.getElementById('content').value.trim();
    
    if (!content) {
        alert('评论内容不能为空');
        return;
    }
    
    // 使用 AJAX 提交
    var formData = new FormData(form);
    
    fetch('admin.php?action=comment&sub=update', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            alert(data.msg);
            window.location.href = 'admin.php?action=comment';
        } else {
            alert(data.msg || '操作失败');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('操作失败，请重试');
    });
}
</script>
