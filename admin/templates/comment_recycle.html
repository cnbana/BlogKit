    <script>
    // ==================== 回收站批量操作（对齐评论列表页交互） ====================
    // 说明：批量恢复/批量彻底删除端点（batchRestore/batchForceDelete）返回 JSON 响应，
    // 因此这里用 fetch 提交并根据响应弹出 toast 后刷新列表，
    // 避免表单整页提交导致浏览器直接渲染裸 JSON 文本。
    document.addEventListener('DOMContentLoaded', function() {
        // 收集当前勾选的评论 ID 列表（行复选框统一命名 ids[]）
        const getRecycleSelectedIds = () =>
            Array.from(document.querySelectorAll('input[name="ids[]"]:checked')).map((cb) => cb.value);

        // 统一 POST 提交（ids[] + 额外参数 + CSRF 令牌），成功后延迟刷新让用户看到提示
        const submitRecycleBatchJson = (url, params) => {
            const body = new URLSearchParams();
            getRecycleSelectedIds().forEach((id) => body.append('ids[]', id));
            Object.keys(params).forEach((key) => body.append(key, params[key]));
            body.append('csrf_token', '<?php echo $_SESSION['csrf_token']; ?>');
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: body.toString()
            })
                .then((res) => res.json())
                .then((res) => {
                    showToast(res.msg || (res.code === 200 ? '操作成功' : '操作失败'), res.code === 200 ? 'success' : 'error');
                    if (res.code === 200) {
                        setTimeout(() => window.location.reload(), 800);
                    }
                })
                .catch(() => showToast('请求失败，请重试', 'error'));
        };

        // 全选/取消全选：与行内复选框状态联动，并同步行高亮
        const recycleSelectAll = document.getElementById('select_all');
        if (recycleSelectAll) {
            recycleSelectAll.addEventListener('change', function() {
                document.querySelectorAll('input[name="ids[]"]').forEach(function(cb) {
                    cb.checked = recycleSelectAll.checked;
                    cb.closest('tr').classList.toggle('selected', cb.checked);
                });
            });
        }

        // 单选时高亮行（tables.css 的 tr.selected 样式）
        document.querySelectorAll('input[name="ids[]"]').forEach(function(cb) {
            cb.addEventListener('change', function() {
                cb.closest('tr').classList.toggle('selected', cb.checked);
            });
        });

        // 批量菜单点击分发：恢复走 batchRestore；彻底删除为不可恢复的危险操作，强确认后提交
        document.querySelectorAll('.batch-menu a[data-batch]').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const action = this.getAttribute('data-batch');
                if (getRecycleSelectedIds().length === 0) {
                    showToast('请先选择评论', 'error');
                    return;
                }
                if (action === 'restore') {
                    // 批量恢复：普通确认即可
                    showConfirmDialog('确定要恢复选中的评论吗？', { type: 'info', title: '批量操作', confirmText: '恢复' }).then(function(ok) {
                        if (ok) submitRecycleBatchJson('admin.php?action=comment&sub=batchRestore', {});
                    });
                } else if (action === 'force-delete') {
                    // 批量彻底删除：危险操作强确认（红色样式确认弹窗，物理删除不可恢复）
                    showConfirmDialog('确定要彻底删除选中的评论吗？此操作不可恢复。', { type: 'danger', confirmText: '彻底删除' }).then(function(ok) {
                        if (ok) submitRecycleBatchJson('admin.php?action=comment&sub=batchForceDelete', {});
                    });
                }
            });
        });
    });
    </script>
