    <script>
    // 首屏防闪烁：原生 select 原先要等 DOMContentLoaded（common.js）才被

    // common.js 的 DOMContentLoaded 回调会再次调用，但单个 select 已带
    // data-ui-select 标记、bindGlobalSelectClose 有防重复绑定守卫，均幂等
    if (typeof initCustomSelects === 'function') {
        initCustomSelects();
        bindGlobalSelectClose();
    }
    </script>
