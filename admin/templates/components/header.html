<body>
    <script>
    // 立即设置侧边栏状态，避免加载闪烁
    (function() {
        try {
            const collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            const theme = localStorage.getItem('sidebarTheme');

            // 立即应用折叠状态
            if (collapsed) {
                document.documentElement.classList.add('sidebar-collapsed-init');
                document.body.classList.add('sidebar-collapsed-init');
            }

            // auto 主题标记：与 sidebar.js 的默认值（无存储时取 auto）保持一致。
            // 首帧主题切换按钮需显示「跟随系统」图标，此标记类供 CSS 选中
            // auto 图标（可与下方暗色初始化类并存，CSS 中 auto 规则后置覆盖）
            if (theme === 'auto' || theme === null) {
                document.documentElement.classList.add('theme-auto-init');
                document.body.classList.add('theme-auto-init');
            }

            // 立即应用主题
            if (theme === 'dark') {
                document.documentElement.classList.add('theme-dark-init');
                document.body.classList.add('theme-dark-init');
            } else if (theme === 'light') {
                document.documentElement.classList.add('theme-light-init');
                document.body.classList.add('theme-light-init');
            } else if ((theme === 'auto' || theme === null) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('theme-dark-init');
                document.body.classList.add('theme-dark-init');
            }
        } catch(e) {}
    })();
    </script>
