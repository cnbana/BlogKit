    <script>
    // 立即设置侧边栏状态，避免加载闪烁
    (function() {
        try {
            const collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            const theme = localStorage.getItem('sidebarTheme');
            
            // 立即应用折叠状态
            if (collapsed) {
                document.documentElement.classList.add('sidebar-collapsed-init');
                document.body.classList.add('sidebar-collapsed-init');
            }
            
            // 立即应用主题
            if (theme === 'dark') {
                document.documentElement.classList.add('theme-dark-init');
                document.body.classList.add('theme-dark-init');
            } else if (theme === 'light') {
                document.documentElement.classList.add('theme-light-init');
                document.body.classList.add('theme-light-init');
            } else if (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('theme-dark-init');
                document.body.classList.add('theme-dark-init');
            }
        } catch(e) {}
    })();
    </script>
