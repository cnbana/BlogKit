            <!-- 验证码实时预览脚本 -->
            <script>
                // 更新验证码预览
                function updateCaptchaPreview() {
                    const captchaImg = document.getElementById('captcha-img');
                    if (!captchaImg) return;
                    
                    // 获取所有验证码相关字段的值
                    const captchaType = document.getElementById('captcha_type').value;
                    const captchaLength = document.getElementById('captcha_length').value;
                    const captchaWidth = document.getElementById('captcha_width').value;
                    const captchaHeight = document.getElementById('captcha_height').value;
                    const captchaFontSize = document.getElementById('captcha_font_size').value;
                    const captchaBgColor = document.getElementById('captcha_bg_color').value;
                    const captchaShowLines = document.getElementById('captcha_show_lines').value;
                    const captchaLineCount = document.getElementById('captcha_line_count').value;
                    const captchaShowNoise = document.getElementById('captcha_show_noise').value;
                    const captchaNoiseLevel = document.getElementById('captcha_noise_level').value;
                    
                    // 构建新的验证码URL
                    let url = 'admin.php?action=captcha';
                    url += '&type=' + captchaType;
                    url += '&length=' + captchaLength;
                    url += '&width=' + captchaWidth;
                    url += '&height=' + captchaHeight;
                    url += '&font_size=' + captchaFontSize;
                    url += '&bg_color=' + encodeURIComponent(captchaBgColor);
                    url += '&show_lines=' + captchaShowLines;
                    url += '&line_count=' + captchaLineCount;
                    url += '&show_noise=' + captchaShowNoise;
                    url += '&noise_level=' + captchaNoiseLevel;
                    url += '&t=' + Date.now(); // 添加时间戳防止缓存
                    
                    // 更新验证码图片
                    captchaImg.src = url;
                }
                
                // 添加事件监听器
                document.addEventListener('DOMContentLoaded', function() {
                    // 监听所有验证码相关字段的变化
                    const captchaFields = [
                        'captcha_type', 'captcha_length', 'captcha_width', 'captcha_height',
                        'captcha_font_size', 'captcha_bg_color', 'captcha_show_lines',
                        'captcha_line_count', 'captcha_show_noise', 'captcha_noise_level'
                    ];
                    
                    captchaFields.forEach(fieldId => {
                        const field = document.getElementById(fieldId);
                        if (field) {
                            field.addEventListener('change', updateCaptchaPreview);
                            field.addEventListener('input', updateCaptchaPreview);
                        }
                    });
                    
                    // 添加刷新按钮事件
                    const refreshBtn = document.getElementById('refresh-captcha');
                    if (refreshBtn) {
                        refreshBtn.addEventListener('click', updateCaptchaPreview);
                    }
                    
                    // 添加点击图片刷新功能
                    const captchaImg = document.getElementById('captcha-img');
                    if (captchaImg) {
                        captchaImg.style.cursor = 'pointer';
                        captchaImg.addEventListener('click', updateCaptchaPreview);
                    }
                });
            </script>
