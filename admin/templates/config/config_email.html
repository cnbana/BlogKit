            <!-- 测试邮箱输入弹窗：替代原生 prompt()，对齐后台统一 .modal-overlay 弹窗体系 -->
            <div class="modal-overlay" id="test-email-modal">
                <div class="modal modal-sm" role="dialog" aria-modal="true">
                    <div class="modal-header">
                        <h3 class="modal-title">发送测试邮件</h3>
                        <button type="button" class="modal-close" aria-label="关闭">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="test_email_input">测试接收邮箱地址</label>
                            <!-- 原内联 width:100% 已移除：forms.css 元素级基础规则
                                 （input 的 8 个 :not 链）与 .form-group input 均已提供 width:100% -->
                            <input type="text" id="test_email_input" placeholder="例如：admin@example.com">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary confirm-cancel">取消</button>
                        <button type="button" class="btn btn-primary confirm-ok">发送</button>
                    </div>
                </div>
            </div>
            <script>
            // —— 邮箱配置表单的交互逻辑 ——
            // 1. 管理员点击"保存设置"时：若密码输入框仍为空，将 value 改为 __KEEP__
            //    以便后端识别"未修改密码"并保留数据库中已加密的原值。
            // 2. 点击"发送测试邮件"时：
            //    - 若密码输入框为空，后端也会收到 __KEEP__ 作为"沿用已有密码"的信号
            //    - 若管理员手动输入了新密码，则用该新密码发送测试邮件，并在发送成功后自动持久化
            (function(){
                var passwordInput = document.getElementById('email_smtp_password');
                var placeholderValue = passwordInput ? passwordInput.getAttribute('data-placeholder-value') : '';

                function buildSmtpFormData() {
                    var formData = new FormData();
                    formData.append('email_smtp_host', document.getElementById('email_smtp_host').value);
                    formData.append('email_smtp_port', document.getElementById('email_smtp_port').value);
                    formData.append('email_smtp_encryption', document.getElementById('email_smtp_encryption').value);
                    formData.append('email_smtp_username', document.getElementById('email_smtp_username').value);
                    formData.append('email_from_address', document.getElementById('email_from_address').value);
                    formData.append('email_from_name', document.getElementById('email_from_name').value);
                    // 密码框的 value：空则表示沿用已有密码（后端会从数据库解密取出）
                    var passwordValue = passwordInput.value.trim();
                    if (passwordValue === '') {
                        formData.append('email_smtp_password', placeholderValue || '__KEEP__');
                    } else {
                        formData.append('email_smtp_password', passwordValue);
                    }
                    return formData;
                }

                // 提交表单时：若密码仍为空，将其替换为 __KEEP__，防止把明文"空"当作新密码入库
                var form = document.getElementById('emailSettingsForm');
                if (form) {
                    form.addEventListener('submit', function(){
                        if (passwordInput.value.trim() === '' && placeholderValue) {
                            passwordInput.value = placeholderValue;
                        }
                    });
                }

                // —— 测试邮箱输入弹窗（替代原生 prompt，统一后台弹窗风格） ——
                var testEmailOverlay = document.getElementById('test-email-modal');
                var testEmailInput = document.getElementById('test_email_input');

                // 打开弹窗：清空上次输入并聚焦，便于直接键入
                window.openTestEmailModal = function() {
                    testEmailInput.value = '';
                    testEmailOverlay.classList.add('show');
                    setTimeout(function(){ testEmailInput.focus(); }, 50);
                };

                // 关闭弹窗：取消按钮 / 右上角× / 点击遮罩空白处
                function closeTestEmailModal() {
                    testEmailOverlay.classList.remove('show');
                }
                testEmailOverlay.querySelector('.confirm-cancel').addEventListener('click', closeTestEmailModal);
                testEmailOverlay.querySelector('.modal-close').addEventListener('click', closeTestEmailModal);
                testEmailOverlay.addEventListener('click', function(e) {
                    if (e.target === testEmailOverlay) closeTestEmailModal();
                });

                // 确定发送：校验非空后沿用原 fetch 发送逻辑
                testEmailOverlay.querySelector('.confirm-ok').addEventListener('click', function() {
                    var testEmail = testEmailInput.value.trim();
                    if (!testEmail) {
                        showToast('请输入测试接收邮箱地址', 'warning');
                        return;
                    }
                    closeTestEmailModal();
                    var resultEl = document.getElementById('testEmailResult');
                    // 结果文字使用语义色 Token（暗色主题自动适配），不使用装饰符号与硬编码色值
                    resultEl.innerHTML = '<span style="color: var(--warning-color);">正在发送...</span>';
                    var formData = buildSmtpFormData();
                    formData.append('test_email', testEmail);
                    // CSRF 令牌：与后台其他写操作同一标准（后端 test 方法校验；
                    // 页面关闭 CSRF 防护时此处输出空串，后端开关放行）
                    formData.append('csrf_token', '<?php echo Security::generateCsrfToken(); ?>');
                    fetch('admin.php?action=<?php echo $currentAction; ?>&method=test', {
                        method: 'POST', body: formData
                    })
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                        resultEl.innerHTML = d.success
                            ? '<span style="color: var(--success-color);">发送成功：' + d.message + '</span>'
                            : '<span style="color: var(--danger-color);">发送失败：' + (d.message || '请检查SMTP配置后重试') + '</span>';
                    })
                    .catch(function(e) {
                        resultEl.innerHTML = '<span style="color: var(--danger-color);">请求失败，请检查网络后重试</span>';
                    });
                });
            })();
            </script>

                <?php endif; ?>
            </div>
