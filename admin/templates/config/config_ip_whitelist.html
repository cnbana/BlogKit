                    <!-- IP白名单管理 -->
                    <div class="form-section">

                    <!-- 可信代理设置 -->
                    <div class="form-section">
                        <h4>可信代理设置</h4>
                        <p style="margin-bottom: 15px; color: #6c757d;">如果您的网站使用了CDN或反向代理，请在此配置可信代理IP，系统将从这些代理的HTTP头中获取真实客户端IP。</p>
                        <div class="form-row" style="margin-bottom: 15px;">
                            <div class="form-col" style="flex: 1;">
                                <input type="text" id="new_proxy_ip" placeholder="请输入代理IP地址">
                            </div>

                                <button type="button" class="btn btn-primary" onclick="addProxyIp()">添加</button>

                            <table id="trustedProxiesTable">
                                <thead>
                                    <tr>
                                        <th>代理IP</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="trustedProxiesBody">
                                </tbody>
                            </table>

            <!-- IP白名单JavaScript -->
            <script>
                let ipWhitelist = [];
                let trustedProxies = [];
                
                document.addEventListener('DOMContentLoaded', function() {
                    const whitelistInput = document.getElementById('admin_ip_whitelist');
                    const proxiesInput = document.getElementById('admin_ip_trusted_proxies');
                    
                    try {
                        ipWhitelist = JSON.parse(whitelistInput.value) || [];
                    } catch (e) {
                        ipWhitelist = [];
                    }
                    
                    try {
                        trustedProxies = JSON.parse(proxiesInput.value) || [];
                    } catch (e) {
                        trustedProxies = [];
                    }
                    
                    renderIpWhitelist();
                    renderTrustedProxies();
                });
                
                function addIpRule() {
                    const input = document.getElementById('new_ip_rule');
                    const rule = input.value.trim();
                    
                    if (!rule) {
                        showToast('请输入IP地址或IP段', 'error');
                        return;
                    }

                    if (validateIpRule(rule)) {
                        ipWhitelist.push(rule);
                        input.value = '';
                        renderIpWhitelist();
                        updateHiddenInputs();
                    } else {
                        showToast('IP地址格式不正确，请输入有效的IPv4、IPv6地址或CIDR格式的IP段', 'warning');
                    }
                }
                
                function validateIpRule(rule) {
                    const ipv4Regex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\/(?:[0-9]|[1-2][0-9]|3[0-2]))?$/;
                    const ipv6Regex = /^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}(?:\/(?:[0-9]|[1-9][0-9]|1[01][0-9]|2[0-8]))?$|^::$|^::1$|^(?:[0-9a-fA-F]{1,4}:){1,7}:$|^(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}$|^(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}$|^(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}$|^[0-9a-fA-F]{1,4}:(?::[0-9a-fA-F]{1,4}){1,6}$|^:(?::[0-9a-fA-F]{1,4}){1,7}$/;
                    
                    return ipv4Regex.test(rule) || ipv6Regex.test(rule);
                }
                
                function deleteIpRule(index) {
                    if (confirm('确定要删除此IP规则吗？')) {
                        ipWhitelist.splice(index, 1);
                        renderIpWhitelist();
                        updateHiddenInputs();
                    }
                }
                
                function renderIpWhitelist() {
                    const tbody = document.getElementById('ipWhitelistBody');
                    const emptyDiv = document.getElementById('emptyWhitelist');
                    
                    tbody.innerHTML = '';
                    
                    if (ipWhitelist.length === 0) {
                        emptyDiv.style.display = 'block';
                        return;
                    }
                    
                    emptyDiv.style.display = 'none';
                    
                    ipWhitelist.forEach((rule, index) => {
                        const tr = document.createElement('tr');
                        const type = rule.includes('/') ? 'IP段' : (rule.includes(':') ? 'IPv6' : 'IPv4');
                        
                        tr.innerHTML = `
                            <td>${rule}</td>
                            <td>${type}</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-danger" onclick="deleteIpRule(${index})">删除</button>
                            </td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                }
                
                function addProxyIp() {
                    const input = document.getElementById('new_proxy_ip');
                    const ip = input.value.trim();
                    
                    if (!ip) {
                        showToast('请输入代理IP地址', 'error');
                        return;
                    }

                    if (validateIpAddress(ip)) {
                        trustedProxies.push(ip);
                        input.value = '';
                        renderTrustedProxies();
                        updateHiddenInputs();
                    } else {
                        showToast('IP地址格式不正确，请输入有效的IPv4或IPv6地址', 'warning');
                    }
                }
                
                function validateIpAddress(ip) {
                    const ipv4Regex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
                    const ipv6Regex = /^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$|^::$|^::1$|^(?:[0-9a-fA-F]{1,4}:){1,7}:$|^(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}$|^(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}$|^(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}$|^[0-9a-fA-F]{1,4}:(?::[0-9a-fA-F]{1,4}){1,6}$|^:(?::[0-9a-fA-F]{1,4}){1,7}$/;
                    
                    return ipv4Regex.test(ip) || ipv6Regex.test(ip);
                }
                
                function deleteProxyIp(index) {
                    if (confirm('确定要删除此代理IP吗？')) {
                        trustedProxies.splice(index, 1);
                        renderTrustedProxies();
                        updateHiddenInputs();
                    }
                }
                
                function renderTrustedProxies() {
                    const tbody = document.getElementById('trustedProxiesBody');
                    const emptyDiv = document.getElementById('emptyProxies');
                    
                    tbody.innerHTML = '';
                    
                    if (trustedProxies.length === 0) {
                        emptyDiv.style.display = 'block';
                        return;
                    }
                    
                    emptyDiv.style.display = 'none';
                    
                    trustedProxies.forEach((ip, index) => {
                        const tr = document.createElement('tr');
                        
                        tr.innerHTML = `
                            <td>${ip}</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-danger" onclick="deleteProxyIp(${index})">删除</button>
                            </td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                }
                
                function updateHiddenInputs() {
                    document.getElementById('admin_ip_whitelist').value = JSON.stringify(ipWhitelist);
                    document.getElementById('admin_ip_trusted_proxies').value = JSON.stringify(trustedProxies);
                }
            </script>
