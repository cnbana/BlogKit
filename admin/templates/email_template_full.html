    <script>
    // 预览模板功能
    $(document).ready(function() {
        $('#preview-btn').on('click', function() {
            const type = $('#type').val();
            const subject = $('#subject').val();
            const content = $('#content').val();
            
            $.ajax({
                url: 'admin.php?action=email_template&method=preview',
                type: 'POST',
                data: {
                    type: type,
                    subject: subject,
                    content: content
                },
                dataType: 'json',
                success: function(response) {
                    if (response.success) {
                        const result = response.data;
                        let html = '<h3>预览结果</h3>';
                        html += '<div style="margin-bottom: 20px;">';
                        html += '<strong>主题：</strong>' + result.subject + '<br>';
                        html += '<strong>内容：</strong>';
                        html += '</div>';
                        html += '<div style="border: 1px solid #eee; padding: 15px;">' + result.content + '</div>';
                        $('#preview-result').html(html);
                    } else {
                        $('#preview-result').html('<div style="color: red;">预览失败：' + (response.message || '未知错误') + '</div>');
                    }
                },
                error: function() {
                    $('#preview-result').html('<div style="color: red;">预览失败：网络错误</div>');
                }
            });
        });
    });
    </script>
