<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 后台管理</title>
    <link rel="stylesheet" href="<?php echo ADMIN_ASSETS_URL; ?>/css/auth.css">
</head>
<body>
    <div class="login-box">
        <h1>忘记密码</h1>
        
        <?php if (!empty($error)): ?>
        <div class="error">
            <?php echo htmlspecialchars($error); ?>
        </div>
        <?php endif; ?>
        
        <?php if (!empty($success)): ?>
        <div class="success-message">
            <?php echo htmlspecialchars($success); ?>
        </div>
        <?php endif; ?>
        
        <form action="admin.php?action=forgot-password" method="post">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" name="email" required placeholder="请输入您的注册邮箱">
            </div>
            
            <?php if ($captchaEnabled && $captchaForgotPasswordEnabled): ?>
            <div class="form-group">
                <label for="captcha_code">验证码</label>
                <div class="captcha-row">
                    <input type="text" id="captcha_code" name="captcha_code" required class="captcha-input-flex" placeholder="请输入验证码">
                    <div class="captcha-img-group">
                        <img id="captcha_image" src="admin.php?action=captcha&t=<?php echo time(); ?>" alt="验证码" class="captcha-img">
                        <button type="button" id="captcha_refresh" class="captcha-refresh-btn">
                            ↻
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn">发送重置邮件</button>
        </form>
        
        <div class="form-footer">
            <a href="admin.php?action=login">返回登录</a>
        </div>
    </div>
    
    <script nonce="<?php echo $_SESSION['csp_nonce']; ?>">
        function refreshCaptcha() {
            const captchaImage = document.getElementById('captcha_image');
            const captchaInput = document.getElementById('captcha_code');
            if (captchaImage) {
                const timestamp = new Date().getTime();
                captchaImage.src = 'admin.php?action=captcha&t=' + timestamp;
            }
            if (captchaInput) {
                captchaInput.value = '';
                // 清空验证消息
                const messageElement = document.getElementById('captcha_message');
                if (messageElement) {
                    messageElement.textContent = '';
                    messageElement.className = 'captcha-message';
                }
            }
        }
        
        // 验证验证码
        function verifyCaptcha(code) {
            if (!code) {
                return;
            }
            
            // 发送验证请求
            fetch('admin.php?action=captcha&verify=1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `code=${encodeURIComponent(code)}`
            })
            .then(response => response.json())
            .then(data => {
                // 创建或获取消息元素
                let messageElement = document.getElementById('captcha_message');
                if (!messageElement) {
                    messageElement = document.createElement('div');
                    messageElement.id = 'captcha_message';
                    messageElement.className = 'captcha-message';
                    const captchaGroup = document.querySelector('.form-group:last-of-type');
                    captchaGroup.appendChild(messageElement);
                }
                
                if (data.success) {
                    messageElement.textContent = '验证码正确';
                    messageElement.style.color = '#28a745';
                } else {
                    messageElement.textContent = '验证码错误';
                    messageElement.style.color = '#dc3545';
                }
            })
            .catch(error => {
                console.error('验证码验证失败:', error);
            });
        }
        
        const captchaImage = document.getElementById('captcha_image');
        const captchaRefresh = document.getElementById('captcha_refresh');
        const captchaInput = document.getElementById('captcha_code');
        
        if (captchaImage) {
            captchaImage.addEventListener('click', refreshCaptcha);
        }
        
        if (captchaRefresh) {
            captchaRefresh.addEventListener('click', refreshCaptcha);
        }
        
        // 实时验证事件
        if (captchaInput) {
            let debounceTimer;
            captchaInput.addEventListener('input', (e) => {
                const code = e.target.value.trim();
                
                // 清除之前的定时器
                clearTimeout(debounceTimer);
                
                // 只有当输入长度大于等于4时才进行验证
                if (code.length >= 4) {
                    // 添加防抖，避免频繁请求
                    debounceTimer = setTimeout(() => {
                        verifyCaptcha(code);
                    }, 500);
                } else if (code.length === 0) {
                    // 清空消息
                    const messageElement = document.getElementById('captcha_message');
                    if (messageElement) {
                        messageElement.textContent = '';
                        messageElement.className = 'captcha-message';
                    }
                }
            });
        }
    </script>
</body>
</html>
