    <script>
        // ==================== 友链列表批量交互 ====================
        // 表头全选框：勾选/取消同步全部行选择框
        document.getElementById('select-all').addEventListener('change', function () {
            document.querySelectorAll('.friendlink_checkbox').forEach(function (cb) {
                cb.checked = document.getElementById('select-all').checked;
            });
        });

        // 批量删除：校验勾选 -> 确认弹窗 -> 提交表格内嵌表单（后端接收 ids[]）
        document.getElementById('batch-delete-btn').addEventListener('click', function (e) {
            e.preventDefault();
            var checked = document.querySelectorAll('.friendlink_checkbox:checked');
            if (checked.length === 0) {
                showToast('请先选择友情链接', 'error');
                return;
            }
            showConfirmDialog('确定要删除选中的 ' + checked.length + ' 条友情链接吗？', { type: 'danger', confirmText: '删除' }).then(function (ok) {
                if (ok) document.getElementById('friendlink-form').submit();
            });
        });
    </script>
