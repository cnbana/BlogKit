    <script>
    (function () {
        var selectAll = document.getElementById('select-all');
        var form = document.getElementById('interaction-form');
        var batchBtn = document.getElementById('batch-delete-btn');

        // 只在有相应元素的时候才启用功能
        if (selectAll && form) {
            selectAll.addEventListener('change', function () {
                var boxes = document.querySelectorAll('input[name="ids[]"][form="interaction-form"]');
                for (var i = 0; i < boxes.length; i++) {
                    boxes[i].checked = selectAll.checked;
                }
            });
        }

        if (batchBtn && form) {
            batchBtn.addEventListener('click', function () {
                var checked = form.querySelectorAll('input[name="ids[]"]:checked');
                if (checked.length === 0) {
                    alert('请先选择要删除的记录');
                    return;
                }
                
                // 根据当前页面显示不同的提示
                var sub = '<?php echo $sub; ?>';
                var typeText = '记录';
                if (sub === 'like') {
                    typeText = '点赞记录';
                } else if (sub === 'favorite') {
                    typeText = '收藏记录';
                }
                
                if (confirm('确定要批量删除选中的 ' + checked.length + ' 条' + typeText + '吗？')) {
                    form.submit();
                }
            });
        }
    })();
    </script>
