<!-- 模态框JavaScript -->
<script>
    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function() {
        // 获取模态框元素
        const modal = document.getElementById('logDetailModal');
        const modalContent = document.getElementById('logDetailsContent');
        
        // 为所有详情按钮添加点击事件
        const detailButtons = document.querySelectorAll('.view-details');
        detailButtons.forEach(button => {
            button.addEventListener('click', function() {
                // 获取日志数据
                const logData = JSON.parse(this.getAttribute('data-log'));
                
                // 填充详情内容
                let detailsHTML = '';
                
                // 添加基本信息
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">时间：</span>';
                detailsHTML += '<span class="log-detail-value">' + new Date(logData.time * 1000).toLocaleString('zh-CN') + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">级别：</span>';
                detailsHTML += '<span class="log-detail-value">' + logData.level_name + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">分类：</span>';
                detailsHTML += '<span class="log-detail-value">' + logData.category + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">消息：</span>';
                detailsHTML += '<span class="log-detail-value">' + logData.message + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">IP：</span>';
                detailsHTML += '<span class="log-detail-value">' + (logData.ip || '') + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">用户：</span>';
                detailsHTML += '<span class="log-detail-value">' + (logData.user_id > 0 ? logData.user_id : '系统') + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">请求URI：</span>';
                detailsHTML += '<span class="log-detail-value">' + (logData.request_uri || '') + '</span>';
                detailsHTML += '</div>';
                
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">用户代理：</span>';
                detailsHTML += '<span class="log-detail-value">' + (logData.user_agent || '') + '</span>';
                detailsHTML += '</div>';
                
                // 添加格式信息
                detailsHTML += '<div class="log-detail-item">';
                detailsHTML += '<span class="log-detail-label">格式：</span>';
                detailsHTML += '<span class="log-detail-value">' + (logData.format || 'text') + '</span>';
                detailsHTML += '</div>';
                
                // 添加上下文信息
                if (logData.context && Object.keys(logData.context).length > 0) {
                    detailsHTML += '<div class="log-detail-item">';
                    detailsHTML += '<span class="log-detail-label">上下文：</span>';
                    detailsHTML += '<div class="log-detail-context">';
                    detailsHTML += JSON.stringify(logData.context, null, 2);
                    detailsHTML += '</div>';
                    detailsHTML += '</div>';
                }
                
                // 显示详情
                modalContent.innerHTML = detailsHTML;
                
                // 显示模态框
                modal.style.display = 'block';
            });
        });
        
        // 为关闭按钮添加点击事件
        const closeButtons = modal.querySelectorAll('[data-dismiss="modal"]');
        closeButtons.forEach(button => {
            button.addEventListener('click', function() {
                modal.style.display = 'none';
            });
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    });
    
    // 清理确认函数
    function confirmClean(type) {
        const modal = document.getElementById('cleanConfirmModal');
        const messageDiv = document.getElementById('cleanConfirmMessage');
        const confirmLink = document.getElementById('cleanConfirmLink');
        
        if (type === 'expired') {
            messageDiv.innerHTML = `
                <p>您确定要清理过期日志吗？</p>
                <div style="margin-top: 15px; padding: 15px; background-color: #f8f9fa; border-radius: 4px; font-size: 14px;">
                    <h5 style="margin-top: 0; margin-bottom: 10px; color: #333;">注意事项：</h5>
                    <ul style="margin: 0; padding-left: 20px;">
                        <li>此操作将删除超过保留期限的日志</li>
                        <li>默认保留期限为7天</li>
                        <li>操作不可撤销，但不会影响近期的日志记录</li>
                        <li>建议定期执行此操作以保持系统清洁</li>
                    </ul>
                </div>
            `;
            confirmLink.href = 'admin.php?action=log&method=clean';
            // 恢复按钮状态
            confirmLink.style.backgroundColor = '#007bff';
            confirmLink.style.cursor = 'pointer';
            confirmLink.style.pointerEvents = 'auto';
            confirmLink.innerHTML = '确认清理';
        } else if (type === 'all') {
            messageDiv.innerHTML = `
                <p>您确定要清理全部日志吗？</p>
                <div style="margin-top: 15px; padding: 15px; background-color: #f8d7da; border-radius: 4px; font-size: 14px;">
                    <h5 style="margin-top: 0; margin-bottom: 10px; color: #721c24;">警告：</h5>
                    <ul style="margin: 0; padding-left: 20px;">
                        <li>此操作将删除所有日志记录，无论是否过期</li>
                        <li>操作不可撤销，所有日志数据将被永久删除</li>
                        <li>删除后将无法查看任何历史日志</li>
                        <li>请确保您真的需要删除所有日志记录</li>
                    </ul>
                </div>
            `;
            confirmLink.href = 'admin.php?action=log&method=cleanAll';
            
            // 设置倒计时状态
            confirmLink.style.backgroundColor = '#6c757d';
            confirmLink.style.cursor = 'not-allowed';
            confirmLink.style.pointerEvents = 'none';
            
            // 开始倒计时
            let countdown = 5;
            confirmLink.innerHTML = `确认清理 (${countdown}s)`;
            
            const timer = setInterval(() => {
                countdown--;
                confirmLink.innerHTML = `确认清理 (${countdown}s)`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    // 恢复按钮状态
                    confirmLink.style.backgroundColor = '#007bff';
                    confirmLink.style.cursor = 'pointer';
                    confirmLink.style.pointerEvents = 'auto';
                    confirmLink.innerHTML = '确认清理';
                }
            }, 1000);
        }
        
        modal.style.display = 'block';
    }
    
    // 关闭清理确认对话框
    function closeCleanConfirm() {
        const modal = document.getElementById('cleanConfirmModal');
        modal.style.display = 'none';
    }
    
    // 点击模态框外部关闭
    window.addEventListener('click', function(event) {
        const modal = document.getElementById('cleanConfirmModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    });
</script>
