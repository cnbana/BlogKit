    <script>
        // 全选/取消全选
        window.toggleSelectAll = function() {
            var selectAllCheckbox = document.getElementById('select_all');
            var checkboxes = document.querySelectorAll('.file_checkbox');
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = selectAllCheckbox.checked;
            });
        };
        
        // 执行批量操作
        window.executeBatchAction = function() {
            var action = document.getElementById('batch_action').value;
            if (!action) {
                alert('请选择批量操作');
                return;
            }
            
            var checkedBoxes = document.querySelectorAll('.file_checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('请选择要操作的文件');
                return;
            }
            
            if (action === 'delete' && confirm('确定要删除选中的文件吗？')) {
                var paths = [];
                checkedBoxes.forEach(function(checkbox) {
                    paths.push(checkbox.value);
                });
                
                // 创建表单并提交
                var form = document.createElement('form');
                form.action = 'admin.php?action=media.batch_delete';
                form.method = 'post';
                
                paths.forEach(function(path) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'paths[]';
                    input.value = path;
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
            }
        };
        
        // 预览文件
        window.previewFile = function(url, name, type) {
            if (type === 'image') {
                window.open(url, '_blank');
            } else {
                alert('非图片文件无法预览');
            }
        };
        
        // 重命名文件
        window.renameFile = function(path, name) {
            document.getElementById('rename-path').value = path;
            document.getElementById('new-name').value = name;
            document.getElementById('rename-modal').classList.add('show');
        };
        
        // 显示文件详情 - 从 checkbox 的 data-url 获取 url
        window.fileDetails = function(path, name, size, type, modified) {
            document.getElementById('detail-name').textContent = name;
            document.getElementById('detail-size').textContent = size;
            document.getElementById('detail-type').textContent = type;
            document.getElementById('detail-modified').textContent = modified;
            document.getElementById('detail-path').textContent = path;
            
            // 找到对应的 checkbox 来获取 url
            var checkbox = document.querySelector('.file_checkbox[value="' + path + '"]');
            var url = checkbox ? checkbox.getAttribute('data-url') : '';
            document.getElementById('detail-url').href = url;
            document.getElementById('detail-url').textContent = url;
            
            document.getElementById('file-details-modal').classList.add('show');
        };
        
        // 媒体管理页面特定的JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // 重置按钮点击事件
            const resetBtn = document.getElementById('reset-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', function() {
                    // 跳转到指定URL重置筛选
                    window.location.href = 'admin.php?action=media';
                });
            }
            
            // 关闭所有模态框
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('show');
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal.show').forEach(function(modal) {
                        modal.classList.remove('show');
                    });
                }
            });
        });
    </script>
