    <script>
        // 全选/取消全选
        window.toggleSelectAll = function() {
            var selectAllCheckbox = document.getElementById('select_all');
            var checkboxes = document.querySelectorAll('.file_checkbox');
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = selectAllCheckbox.checked;
            });
        };
        
        // 执行批量操作（action 参数由批量下拉菜单项传入，旧下拉框已改为统一下拉菜单）
        window.executeBatchAction = function(action) {
            if (!action) {
                showToast('请选择批量操作', 'warning');
                return;
            }

            var checkedBoxes = document.querySelectorAll('.file_checkbox:checked');
            if (checkedBoxes.length === 0) {
                showToast('请选择要操作的文件', 'warning');
                return;
            }
            
            // 统一确认弹窗（danger 删除类）：确认后收集选中路径并提交批量删除
            if (action === 'delete') {
                showConfirmDialog('确定要删除选中的文件吗？', { type: 'danger', confirmText: '删除' }).then(function(ok) {
                    if (!ok) return;
                    var paths = [];
                    checkedBoxes.forEach(function(checkbox) {
                        paths.push(checkbox.value);
                    });
                    // 两个视图（卡片/列表）各渲染一份复选框且随全选同步勾选，
                    // 此处按路径去重，避免同一文件被重复提交删除
                    paths = Array.from(new Set(paths));

                    // 创建表单并提交
                    var form = document.createElement('form');
                    form.action = 'admin.php?action=media.batch_delete';
                    form.method = 'post';

                    paths.forEach(function(path) {
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'paths[]';
                        input.value = path;
                        form.appendChild(input);
                    });

                    document.body.appendChild(form);
                    form.submit();
                });
            }
        };
        
        // 预览文件
        window.previewFile = function(url, name, type) {
            if (type === 'image') {
                window.open(url, '_blank');
            } else {
                showToast('非图片文件无法预览', 'info');
            }
        };
        
        // 重命名文件
        window.renameFile = function(path, name) {
            document.getElementById('rename-path').value = path;
            document.getElementById('new-name').value = name;
            document.getElementById('rename-modal').classList.add('show');
        };
        
        // 显示文件详情 - 从 checkbox 的 data-url 获取 url
        window.fileDetails = function(path, name, size, type, modified) {
            document.getElementById('detail-name').textContent = name;
            document.getElementById('detail-size').textContent = size;
            document.getElementById('detail-type').textContent = type;
            document.getElementById('detail-modified').textContent = modified;
            document.getElementById('detail-path').textContent = path;
            
            // 找到对应的 checkbox 来获取 url
            var checkbox = document.querySelector('.file_checkbox[value="' + path + '"]');
            var url = checkbox ? checkbox.getAttribute('data-url') : '';
            document.getElementById('detail-url').href = url;
            document.getElementById('detail-url').textContent = url;
            
            document.getElementById('file-details-modal').classList.add('show');
        };
        
        // 媒体管理页面特定的JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // 重置按钮点击事件
            const resetBtn = document.getElementById('reset-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', function() {
                    // 跳转到指定URL重置筛选
                    window.location.href = 'admin.php?action=media';
                });
            }
            
            // 关闭所有模态框
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('show');
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal.show').forEach(function(modal) {
                        modal.classList.remove('show');
                    });
                }
            });

            // 上传文件：AJAX 提交（JSON 返回），上传期间显示进度条，
            // 完成后按结果 Toast 提示并刷新列表（部分失败时列出失败明细）
            var mediaUploadInput = document.getElementById('media-upload-input');
            if (mediaUploadInput) {
                mediaUploadInput.addEventListener('change', function() {
                    if (!this.files || this.files.length === 0) return;

                    var form = document.getElementById('media-upload-form');
                    var btn = document.getElementById('media-upload-btn');
                    var box = document.getElementById('media-upload-progress');
                    var fill = document.getElementById('media-upload-progress-fill');
                    var text = document.getElementById('media-upload-progress-text');

                    // 组装表单数据（含 CSRF 令牌），ajax=1 让后端以 JSON 返回
                    var fd = new FormData(form);
                    fd.append('ajax', '1');

                    // 上传期间锁定触发按钮，避免并发上传
                    btn.disabled = true;
                    box.style.display = '';
                    fill.style.width = '0%';
                    fill.classList.remove('is-error', 'is-done');
                    text.textContent = '正在上传 0%…';

                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', form.action);

                    // 上传进度：按已传输字节计算百分比
                    xhr.upload.addEventListener('progress', function(e) {
                        if (e.lengthComputable) {
                            var pct = Math.round((e.loaded / e.total) * 100);
                            fill.style.width = pct + '%';
                            text.textContent = '正在上传 ' + pct + '%…';
                        }
                    });

                    xhr.addEventListener('load', function() {
                        var res = null;
                        try { res = JSON.parse(xhr.responseText); } catch (err) { res = null; }

                        if (!res) {
                            // 非 JSON 响应（会话过期/服务器错误等）
                            fill.classList.add('is-error');
                            text.textContent = '上传失败';
                            showToast('上传失败，请刷新页面后重试', 'error');
                            btn.disabled = false;
                            return;
                        }

                        if (res.uploaded > 0) {
                            fill.style.width = '100%';
                            fill.classList.add('is-done');
                            text.textContent = '成功上传 ' + res.uploaded + ' 个文件' + (res.failed > 0 ? '，' + res.failed + ' 个失败' : '');
                            // 部分失败时列出失败明细（逐行 Toast，最多提示 3 条避免刷屏）
                            if (res.failed > 0 && res.errors && res.errors.length) {
                                res.errors.slice(0, 3).forEach(function(msg) { showToast(msg, 'warning'); });
                            }
                            // 稍作停留让用户看到完成态，再刷新列表展示新文件
                            setTimeout(function() { window.location.reload(); }, 800);
                        } else {
                            fill.classList.add('is-error');
                            text.textContent = '上传失败';
                            var msg = (res.errors && res.errors.length) ? res.errors.join('；') : '文件上传失败';
                            showToast(msg, 'error');
                            btn.disabled = false;
                            setTimeout(function() { box.style.display = 'none'; }, 1500);
                        }
                    });

                    xhr.addEventListener('error', function() {
                        fill.classList.add('is-error');
                        text.textContent = '上传失败';
                        showToast('网络错误，上传中断', 'error');
                        btn.disabled = false;
                    });

                    xhr.send(fd);
                    // 已选择文件交由 FormData 持有，清空 input 允许再次选择同名文件
                    this.value = '';
                });
            }
        });
    </script>

    <!-- 视图切换逻辑：读写 localStorage（bk_admin_media_view），
         在容器上切换 .md-as-list 类实现卡片/列表布局显隐（CSS 控制），默认图片卡片 -->
    <script>
        (function () {
            var KEY = 'bk_admin_media_view';
            var wrap = document.getElementById('md-view-wrap');
            var btnList = document.getElementById('md-view-list');
            var btnCard = document.getElementById('md-view-card');
            if (!wrap || !btnList || !btnCard) return;

            // 读取本地视图偏好（隐私模式等 localStorage 不可用时静默回退默认卡片）
            var saved = 'card';
            try { saved = localStorage.getItem(KEY) || 'card'; } catch (e) {}

            function apply(view) {
                var isList = view === 'list';
                wrap.classList.toggle('md-as-list', isList);
                // 选中态类为 .seg 组件的通用选中类（common.css 定义浮起样式）
                btnList.classList.toggle('seg-active', isList);
                btnCard.classList.toggle('seg-active', !isList);
            }

            btnList.addEventListener('click', function () {
                apply('list');
                try { localStorage.setItem(KEY, 'list'); } catch (e) {}
            });
            btnCard.addEventListener('click', function () {
                apply('card');
                try { localStorage.setItem(KEY, 'card'); } catch (e) {}
            });

            apply(saved);
        })();
    </script>
