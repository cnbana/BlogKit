    <script>
        // 全选/取消全选
        function toggleSelectAll() {
            var selectAllCheckbox = document.getElementById('select-all');
            var checkboxes = document.querySelectorAll('.notificationCheckbox');
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = selectAllCheckbox.checked;
            });
            toggleBatchDeleteButton();
        }
        
        // 切换批量删除按钮状态
        function toggleBatchDeleteButton() {
            var checkboxes = document.querySelectorAll('.notificationCheckbox:checked');
            var batchDeleteBtn = document.getElementById('batchDeleteBtn');
            batchDeleteBtn.disabled = checkboxes.length === 0;
        }
        
        // 绑定复选框事件
        document.querySelectorAll('.notificationCheckbox').forEach(function(checkbox) {
            checkbox.addEventListener('change', toggleBatchDeleteButton);
        });
        
        // 查看通知详情
        function viewNotification(id) {
            $.get('admin.php?action=notification&method=getNotification&id=' + id, function(data) {
                if (data.success && data.notification) {
                    var notification = data.notification;
                    document.getElementById('notification-detail-id').textContent = notification.id;
                    document.getElementById('notification-detail-title').textContent = notification.title;
                    document.getElementById('notification-detail-type').textContent = notification.type_label || notification.type;
                    document.getElementById('notification-detail-user').textContent = notification.username || '未知用户';
                    document.getElementById('notification-detail-content').innerHTML = notification.content;
                    document.getElementById('notification-detail-status').textContent = notification.read == 0 ? '未读' : '已读';
                    document.getElementById('notification-detail-created').textContent = notification.created_at_formatted;
                    showNotificationModal();
                } else {
                    alert('获取通知详情失败: ' + (data.message || '未知错误'));
                }
            }, 'json').fail(function(xhr, status, error) {
                alert('获取通知详情失败: ' + error);
            });
        }
        
        // 显示模态框
        function showNotificationModal() {
            var overlay = document.getElementById('notification-modal-overlay');
            if (overlay) {
                overlay.classList.add('show');
            }
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭模态框
        function closeNotificationModal() {
            var overlay = document.getElementById('notification-modal-overlay');
            if (overlay) overlay.classList.remove('show');
            document.body.style.overflow = 'auto';
        }
        
        // ESC键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                var overlay = document.getElementById('notification-modal-overlay');
                if (overlay && overlay.classList.contains('show')) {
                    closeNotificationModal();
                }
            }
        });
        
        // 删除单个通知
        function deleteNotification(id) {
            showConfirmDialog('确定要将这条通知移到回收站吗？', { title: '删除通知' }).then(function(result) {
                if (result) {
                    window.location.href = 'admin.php?action=notification&method=delete&id=' + id;
                }
            });
        }
        
        // 批量删除通知
        function batchDelete() {
            var checkboxes = document.querySelectorAll('.notificationCheckbox');
            var selectedIds = [];
            checkboxes.forEach(function(checkbox) {
                if (checkbox.checked) {
                    selectedIds.push(checkbox.value);
                }
            });
            
            if (selectedIds.length === 0) {
                showAlertDialog('请先选择要删除的通知', '提示');
                return;
            }
            
            showConfirmDialog('确定要将选中的 ' + selectedIds.length + ' 条通知移到回收站吗？', { title: '批量删除' }).then(function(result) {
                if (result) {
                    window.location.href = 'admin.php?action=notification&method=batchDelete&ids=' + selectedIds.join(',');
                }
            });
        }
    </script>
