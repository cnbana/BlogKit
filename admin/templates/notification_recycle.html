    <script>
        // 全选/取消全选
        document.getElementById('select-all').addEventListener('change', function() {
            var checkboxes = document.querySelectorAll('input[name="notification_ids[]"]');
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = document.getElementById('select-all').checked;
            });
        });
        
        // 恢复通知
        function restoreNotification(id) {
            if (confirm('确定要恢复这条通知吗？')) {
                window.location.href = 'admin.php?action=notification&method=restore&id=' + id;
            }
        }
        
        // 永久删除通知
        function forceDeleteNotification(id) {
            if (confirm('确定要永久删除这条通知吗？此操作无法撤销！')) {
                window.location.href = 'admin.php?action=notification&method=forceDelete&id=' + id;
            }
        }
        
        // 批量恢复通知
        function batchRestore() {
            var checkboxes = document.querySelectorAll('input[name="notification_ids[]"]:checked');
            if (checkboxes.length === 0) {
                alert('请先选择要恢复的通知');
                return;
            }
            
            if (confirm('确定要恢复选中的 ' + checkboxes.length + ' 条通知吗？')) {
                var ids = [];
                checkboxes.forEach(function(checkbox) {
                    ids.push(checkbox.value);
                });
                window.location.href = 'admin.php?action=notification&method=batchRestore&ids=' + ids.join(',');
            }
        }
        
        // 批量永久删除通知
        function batchForceDelete() {
            var checkboxes = document.querySelectorAll('input[name="notification_ids[]"]:checked');
            if (checkboxes.length === 0) {
                alert('请先选择要永久删除的通知');
                return;
            }
            
            if (confirm('确定要永久删除选中的 ' + checkboxes.length + ' 条通知吗？此操作无法撤销！')) {
                var ids = [];
                checkboxes.forEach(function(checkbox) {
                    ids.push(checkbox.value);
                });
                window.location.href = 'admin.php?action=notification&method=batchForceDelete&ids=' + ids.join(',');
            }
        }
    </script>
