            <div class="form-group" id="user_id_field" style="display: none;">

    <script>
        // 表单验证
        function validateForm() {
            var sendTo = document.getElementById('send_to').value;
            
            // 如果选择单个用户，必须选择用户
            if (sendTo === 'single') {
                var userId = document.getElementById('user_id').value;
                if (!userId || userId <= 0) {
                    alert('请先选择要发送通知的用户');
                    return false;
                }
            }
            
            return true;
        }
        
        // 简易富文本格式化函数
        function formatText(action) {
            var textarea = document.getElementById('content');
            var start = textarea.selectionStart;
            var end = textarea.selectionEnd;
            var selectedText = textarea.value.substring(start, end);
            var beforeText = textarea.value.substring(0, start);
            var afterText = textarea.value.substring(end);
            
            switch (action) {
                case 'bold':
                    textarea.value = beforeText + '**' + selectedText + '**' + afterText;
                    break;
                case 'italic':
                    textarea.value = beforeText + '*' + selectedText + '*' + afterText;
                    break;
                case 'link':
                    var url = prompt('请输入链接地址:', 'https://');
                    if (url) {
                        textarea.value = beforeText + '[' + (selectedText || '链接文本') + '](' + url + ')' + afterText;
                    }
                    break;
                case 'br':
                    textarea.value = beforeText + '\n' + afterText;
                    break;
                case 'undo':
                    document.execCommand('undo', false, null);
                    return;
                case 'redo':
                    document.execCommand('redo', false, null);
                    return;
            }
            
            // 设置光标位置
            setTimeout(function() {
                var newPos = start + (action === 'bold' ? 2 : action === 'italic' ? 1 : 0);
                textarea.setSelectionRange(newPos, newPos + selectedText.length);
                textarea.focus();
            }, 0);
        }
        
        function toggleUserIdField() {
            var sendTo = document.getElementById('send_to').value;
            var userIdField = document.getElementById('user_id_field');
            var userIdInput = document.getElementById('user_id');
            var userRequired = document.getElementById('user_required');
            
            if (sendTo === 'single') {
                userIdField.style.display = 'block';
                userIdInput.required = true;
                userRequired.style.display = 'inline';
            } else {
                userIdField.style.display = 'none';
                userIdInput.required = false;
                userIdInput.value = '0';
                userRequired.style.display = 'none';
                clearSelectedUser();
            }
        }
        
        var searchTimeout = null;
        
        function searchUsers() {
            var keyword = document.getElementById('user_search').value.trim();
            var resultContainer = document.getElementById('user_select_result');
            var selectedUser = document.getElementById('selected_user');
            var clearBtn = document.getElementById('clear_search_btn');
            
            // 显示/隐藏清除按钮
            if (keyword.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            
            // 清除之前的定时器
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }
            
            if (keyword.length < 1) {
                resultContainer.innerHTML = '';
                resultContainer.style.display = 'none';
                return;
            }
            
            // 300ms 防抖
            searchTimeout = setTimeout(function() {
                $.get('admin.php?action=user&method=search', { keyword: keyword, limit: 10 }, function(res) {
                    if (res.success && res.data && res.data.length > 0) {
                        var html = '<div class="result-count">共找到 ' + res.data.length + ' 个用户</div>';
                        html += '<ul>';
                        res.data.forEach(function(user) {
                            html += '<li onclick="selectUser(' + user.id + ', \'' + escapeHtml(user.username) + '\')">';
                            html += '<span class="user-name">' + escapeHtml(user.username) + '</span>';
                            if (user.email) {
                                html += '<span class="user-email">' + escapeHtml(user.email) + '</span>';
                            }
                            html += '</li>';
                        });
                        html += '</ul>';
                        resultContainer.innerHTML = html;
                        resultContainer.style.display = 'block';
                        selectedUser.style.display = 'none';
                    } else {
                        resultContainer.innerHTML = '<div class="no-result">未找到匹配的用户</div>';
                        resultContainer.style.display = 'block';
                    }
                }, 'json').fail(function() {
                    resultContainer.innerHTML = '<div class="no-result">搜索失败</div>';
                    resultContainer.style.display = 'block';
                });
            }, 300);
        }
        
        function clearSearchInput() {
            document.getElementById('user_search').value = '';
            document.getElementById('clear_search_btn').classList.add('hidden');
            document.getElementById('user_select_result').innerHTML = '';
            document.getElementById('user_select_result').style.display = 'none';
        }
        
        function selectUser(userId, username) {
            document.getElementById('user_id').value = userId;
            document.getElementById('selected_user_name').textContent = username;
            document.getElementById('selected_user').style.display = 'block';
            document.getElementById('user_select_result').style.display = 'none';
            document.getElementById('user_search').value = '';
            // 隐藏清除按钮
            document.getElementById('clear_search_btn').classList.add('hidden');
        }
        
        function clearSelectedUser() {
            document.getElementById('user_id').value = '0';
            document.getElementById('selected_user').style.display = 'none';
            document.getElementById('user_search').value = '';
            document.getElementById('user_select_result').style.display = 'none';
        }
        
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }
        
        // 绑定搜索事件
        document.addEventListener('DOMContentLoaded', function() {
            var searchInput = document.getElementById('user_search');
            if (searchInput) {
                searchInput.addEventListener('input', searchUsers);
            }
        });
    </script>
</main>
