<script>
/**
 * 批量操作脚本（对齐文章列表页交互）：
 * 1. 表头全选/取消全选，并同步行选中高亮；
 * 2. 行复选框变化时同步该行 .selected 高亮；
 * 3. 批量菜单点击分发：批量删除为危险操作，先弹确认框，确认后以
 *    POST + ids[] + csrf_token 提交到 batchDelete（后端逐条跳过内置保护角色并汇总数量）。
 * 「已选 N 项」计数徽标由 common.js 的 initBatchSelectedInfo 全局自动维护，无需在此处理。
 */
(function () {
    // 收集当前勾选的角色 ID 列表
    var getSelectedIds = function () {
        return Array.prototype.map.call(
            document.querySelectorAll('.role_checkbox:checked'),
            function (cb) { return cb.value; }
        );
    };

    // 统一构建 POST 表单并提交（ids[] + 额外参数 + CSRF 令牌）
    var submitBatchForm = function (url, params) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = url;
        getSelectedIds().forEach(function (id) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'ids[]';
            input.value = id;
            form.appendChild(input);
        });
        Object.keys(params || {}).forEach(function (key) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = params[key];
            form.appendChild(input);
        });
        // CSRF 令牌：由会话生成，后端 Security::validateCsrfToken 校验
        var tokenInput = document.createElement('input');
        tokenInput.type = 'hidden';
        tokenInput.name = 'csrf_token';
        tokenInput.value = '<?php echo $_SESSION['csrf_token']; ?>';
        form.appendChild(tokenInput);
        document.body.appendChild(form);
        form.submit();
    };

    document.addEventListener('DOMContentLoaded', function () {
        // 全选/取消全选：表头复选框同步所有行复选框的选中状态与行高亮
        var selectAll = document.getElementById('select_all');
        if (selectAll) {
            selectAll.addEventListener('change', function () {
                document.querySelectorAll('.role_checkbox').forEach(function (checkbox) {
                    checkbox.checked = selectAll.checked;
                    checkbox.closest('tr').classList.toggle('selected', selectAll.checked);
                });
            });
        }

        // 单个复选框变化时同步该行高亮
        document.querySelectorAll('.role_checkbox').forEach(function (cb) {
            cb.addEventListener('change', function (e) {
                e.target.closest('tr').classList.toggle('selected', e.target.checked);
            });
        });

        // 批量菜单点击分发（下拉开合由 common.js initDropdowns 统一事件委托处理）
        document.querySelectorAll('.batch-menu a[data-batch]').forEach(function (item) {
            item.addEventListener('click', function (e) {
                e.preventDefault();
                if (getSelectedIds().length === 0) {
                    showToast('请先选择角色', 'error');
                    return;
                }
                // 批量删除：统一确认弹窗（危险操作红色样式），确认后提交；
                // 内置保护角色（管理员/游客/普通用户）由后端跳过并在返回消息中说明
                showConfirmDialog('确定要删除选中的角色吗？', { type: 'danger', confirmText: '删除' }).then(function (ok) {
                    if (ok) {
                        submitBatchForm('admin.php?action=role&method=batchDelete', {});
                    }
                });
            });
        });
    });
})();
</script>
