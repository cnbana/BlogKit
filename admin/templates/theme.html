<!-- 搜索组合框的清空图标逻辑：与市场页同款（输入非空时显示圆形叉号，
     点击清空关键词；搜索由回车或搜索按钮触发，无 JS 时图标保持 hidden） -->
<script>
    (function () {
        var input = document.getElementById('theme-kw-input');
        var clearBtn = document.getElementById('theme-kw-clear');
        if (!input || !clearBtn) return;

        // 按输入框是否有值同步清空图标显隐
        function sync() {
            clearBtn.hidden = (input.value === '');
        }

        // 输入过程实时同步显隐
        input.addEventListener('input', sync);

        // 点击清空：就地清值 + 同步显隐 + 焦点回到输入框（不提交表单、不刷新页面）
        clearBtn.addEventListener('click', function () {
            input.value = '';
            sync();
            input.focus();
        });

        // 页面载入时（关键词回填场景）初始化一次显隐
        sync();
    })();
</script>

<!-- 视图切换逻辑：读写 localStorage（bk_admin_theme_view），
     在容器上切换 .theme-as-list 类实现两种布局的显隐（CSS 控制），默认图片卡片 -->
<script>
    (function () {
        var KEY = 'bk_admin_theme_view';
        var wrap = document.getElementById('theme-app-wrap');
        var btnList = document.getElementById('theme-view-list');
        var btnCard = document.getElementById('theme-view-card');
        if (!wrap || !btnList || !btnCard) return;

        // 读取本地视图偏好（隐私模式等 localStorage 不可用时静默回退默认卡片）
        var saved = 'card';
        try { saved = localStorage.getItem(KEY) || 'card'; } catch (e) {}

        function apply(view) {
            var isList = view === 'list';
            wrap.classList.toggle('theme-as-list', isList);
            // 选中态类为 .seg 组件的通用选中类（common.css 定义浮起样式）
            btnList.classList.toggle('seg-active', isList);
            btnCard.classList.toggle('seg-active', !isList);
        }

        btnList.addEventListener('click', function () {
            apply('list');
            try { localStorage.setItem(KEY, 'list'); } catch (e) {}
        });
        btnCard.addEventListener('click', function () {
            apply('card');
            try { localStorage.setItem(KEY, 'card'); } catch (e) {}
        });

        apply(saved);
    })();
</script>
