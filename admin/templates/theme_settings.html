<?php  $currentAction = 'theme'; $pageTitle = '主题设置'; include 'components/page_wrapper.html'; ?>
    
    <!-- 操作栏 -->
    <div class="action-section">
        <a href="admin.php?action=theme" class="btn btn-secondary drawer-cancel">返回主题列表</a>
        <a href="admin.php?action=theme&sub=export_settings&theme=<?php echo $theme; ?>" class="btn btn-info">导出设置</a>
        <a href="admin.php?action=theme&sub=import_settings&theme=<?php echo $theme; ?>" class="btn btn-warning">导入设置</a>
    </div>
    

    
    <!-- 设置表单 -->
    <div class="settings-form">
        <form action="admin.php?action=theme&sub=save_settings" method="post">
            <input type="hidden" name="theme" value="<?php echo $theme; ?>">
            <?php echo Security::getCsrfField(); ?>
            
            <?php foreach ($settingsConfig as $setting): ?>
                <div class="form-group">
                    <label for="setting-<?php echo $setting['key']; ?>" class="settings-label">
                        <?php echo $setting['label']; ?>
                        <?php if (isset($setting['required']) && $setting['required']): ?>
                            <!-- 必填星号：引用语义色 Token，暗色主题自动适配 -->
                            <span class="settings-required">*</span>
                        <?php endif; ?>
                    </label>

                    <?php if (isset($setting['description'])): ?>
                        <p class="settings-desc"><?php echo $setting['description']; ?></p>
                    <?php endif; ?>
                    
                    <?php $value = $settingsValues[$setting['key']] ?? $setting['default'] ?? ''; ?>
                    
                    <?php if ($setting['type'] == 'text'): ?>
                        <input 
                            type="text" 
                            id="setting-<?php echo $setting['key']; ?>" 
                            name="settings[<?php echo $setting['key']; ?>]" 
                            value="<?php echo htmlspecialchars($value); ?>"
                            class="ts-control"
                            <?php if (isset($setting['required']) && $setting['required']): ?>required<?php endif; ?>
                        >
                    
                    <?php elseif ($setting['type'] == 'textarea'): ?>
                        <textarea 
                            id="setting-<?php echo $setting['key']; ?>" 
                            name="settings[<?php echo $setting['key']; ?>]" 
                            rows="4"
                            class="ts-control"
                            <?php if (isset($setting['required']) && $setting['required']): ?>required<?php endif; ?>
                        ><?php echo htmlspecialchars($value); ?></textarea>
                    
                    <?php elseif ($setting['type'] == 'checkbox'): ?>
                        <!-- 二值开关统一使用滑动开关（与系统设置页一致）；标签由上方共享的
                             settings-label 输出，此处不再渲染行内重复标签，提交行为与原复选框相同 -->
                        <label class="switch">
                            <input
                                type="checkbox"
                                id="setting-<?php echo $setting['key']; ?>"
                                name="settings[<?php echo $setting['key']; ?>]"
                                value="1"
                                <?php if ($value): ?>checked<?php endif; ?>
                            >
                            <span class="switch-slider"></span>
                        </label>
                    
                    <?php elseif ($setting['type'] == 'select'): ?>
                        <select 
                            id="setting-<?php echo $setting['key']; ?>" 
                            name="settings[<?php echo $setting['key']; ?>]"
                            class="ts-control"
                            <?php if (isset($setting['required']) && $setting['required']): ?>required<?php endif; ?>
                        >
                            <?php foreach ($setting['options'] as $optionValue => $optionLabel): ?>
                                <option value="<?php echo $optionValue; ?>" <?php if ($value == $optionValue): ?>selected<?php endif; ?>>
                                    <?php echo $optionLabel; ?>
                                </option>
                            <?php endforeach; ?>
                        </select>
                    
                    <?php elseif ($setting['type'] == 'color'): ?>
                        <input 
                            type="color" 
                            id="setting-<?php echo $setting['key']; ?>" 
                            name="settings[<?php echo $setting['key']; ?>]" 
                            value="<?php echo htmlspecialchars($value); ?>"
                            class="ts-color"
                        >
                    <?php endif; ?>
                </div>
            <?php endforeach; ?>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存设置</button>
            </div>
        </form>
    </div>
<?php include 'components/footer_wrapper.html'; ?>
