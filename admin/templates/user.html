    <script>
        // 用户页面特定的JavaScript
        
        // 切换下拉菜单显示/隐藏
        function toggleDropdown(button) {
            const btnGroup = button.parentElement;
            const isOpen = btnGroup.classList.contains('show');
            
            // 先关闭所有其他下拉菜单
            document.querySelectorAll('.btn-group').forEach(group => {
                group.classList.remove('show');
            });
            
            // 切换当前下拉菜单
            if (!isOpen) {
                btnGroup.classList.add('show');
            }
        }
        
        // 点击页面其他地方关闭下拉菜单
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.btn-group')) {
                document.querySelectorAll('.btn-group').forEach(group => {
                    group.classList.remove('show');
                });
            }
        });
        
        // 全选用户
        function selectAllUsersInTable(checkbox) {
            const userCheckboxes = document.querySelectorAll('.user-checkbox');
            userCheckboxes.forEach(cb => {
                if (!cb.disabled) {
                    cb.checked = checkbox.checked;
                }
            });
        }
        
        // 批量操作选择变化
        document.getElementById('batch-action').addEventListener('change', function() {
            const roleSelect = document.getElementById('batch-role-select');
            if (this.value === 'batch-role') {
                roleSelect.style.display = 'inline-block';
            } else {
                roleSelect.style.display = 'none';
            }
        });
        
        // 执行批量操作
        function executeBatchAction() {
            const action = document.getElementById('batch-action').value;
            const selectedUsers = document.querySelectorAll('.user-checkbox:checked');
            const roleId = document.getElementById('batch-role-select').value;
            
            if (selectedUsers.length === 0) {
                showToast('请选择至少一个用户', 'error');
                return;
            }
            
            const userIds = Array.from(selectedUsers).map(cb => cb.value).join(',');
            
            if (action === 'batch-disable') {
                if (confirm('确定要禁用选中的' + selectedUsers.length + '个用户吗？')) {
                    window.location.href = 'admin.php?action=user&sub=batchToggleStatus&status=0&user_ids=' + userIds;
                }
            } else if (action === 'batch-enable') {
                if (confirm('确定要启用选中的' + selectedUsers.length + '个用户吗？')) {
                    window.location.href = 'admin.php?action=user&sub=batchToggleStatus&status=1&user_ids=' + userIds;
                }
            } else if (action === 'batch-delete') {
                if (confirm('确定要将选中的' + selectedUsers.length + '个用户移至回收站吗？')) {
                    window.location.href = 'admin.php?action=user&sub=batchDelete&user_ids=' + userIds;
                }
            } else if (action === 'batch-role') {
                if (!roleId) {
                    showToast('请选择要修改的角色', 'error');
                    return;
                }
                if (confirm('确定要将选中的' + selectedUsers.length + '个用户的角色修改吗？')) {
                    window.location.href = 'admin.php?action=user&sub=batchUpdateRole&user_ids=' + userIds + '&role_id=' + roleId;
                }
            }
        }
        
        // 导出用户
        function exportUsers(format) {
            const searchParams = new URLSearchParams(window.location.search);
            searchParams.set('action', 'user');
            searchParams.set('sub', 'export');
            searchParams.set('format', format);
            window.location.href = 'admin.php?' + searchParams.toString();
        }
    </script>

</main>
