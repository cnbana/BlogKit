    <script>
        // 用户页面特定的JavaScript

        // 筛选表单提交前移除空值参数，保持 URL 简洁（与文章管理页行为一致）
        document.getElementById('search-form').addEventListener('submit', function() {
            ['search', 'role', 'status', 'created_at_start', 'created_at_end'].forEach(function(name) {
                const field = this.elements[name];
                if (field && field.value === '') {
                    field.removeAttribute('name');
                }
            }, this);
        });
        
        // 下拉菜单开合已由 common.js initDropdowns() 统一处理，无需页面内联实现

        // 全选用户
        function selectAllUsersInTable(checkbox) {
            const userCheckboxes = document.querySelectorAll('.user-checkbox');
            userCheckboxes.forEach(cb => {
                if (!cb.disabled) {
                    cb.checked = checkbox.checked;
                }
            });
        }
        
        // 执行批量操作（由工具栏「批量操作」下拉菜单触发，动作作为参数传入；
        // 未勾选用户时统一 toast 提示；批量修改角色打开页面底部统一弹窗）
        function executeBatchAction(action) {
            const selectedUsers = document.querySelectorAll('.user-checkbox:checked');
            if (selectedUsers.length === 0) {
                showToast('请选择至少一个用户', 'error');
                return;
            }

            const userIds = Array.from(selectedUsers).map(cb => cb.value).join(',');

            // 关闭已打开的下拉菜单（弹窗流程不发生页面跳转，需手动收起）
            document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) {
                menu.classList.remove('show');
                const group = menu.closest('.btn-group, .dropdown');
                if (group) group.classList.remove('show');
            });

            if (action === 'batch-disable') {
                showConfirmDialog('确定要禁用选中的' + selectedUsers.length + '个用户吗？', { type: 'warning', title: '批量操作', confirmText: '禁用' }).then(ok => {
                    if (ok) window.location.href = 'admin.php?action=user&sub=batchToggleStatus&status=0&user_ids=' + userIds;
                });
            } else if (action === 'batch-enable') {
                showConfirmDialog('确定要启用选中的' + selectedUsers.length + '个用户吗？', { type: 'warning', title: '批量操作', confirmText: '启用' }).then(ok => {
                    if (ok) window.location.href = 'admin.php?action=user&sub=batchToggleStatus&status=1&user_ids=' + userIds;
                });
            } else if (action === 'batch-delete') {
                showConfirmDialog('确定要将选中的' + selectedUsers.length + '个用户移至回收站吗？', { type: 'danger', title: '批量操作', confirmText: '移入回收站' }).then(ok => {
                    if (ok) window.location.href = 'admin.php?action=user&sub=batchDelete&user_ids=' + userIds;
                });
            } else if (action === 'batch-role') {
                openBatchRoleModal();
            }
        }

        // ==================== 批量修改角色弹窗 ====================
        // 结构为统一 .modal-overlay > .modal 体系（components.css），.show 控制显隐

        // 打开弹窗（记住本次勾选的用户，提交时拼入请求）
        function openBatchRoleModal() {
            document.getElementById('batchRoleModal').classList.add('show');
        }

        // 关闭弹窗（× / 取消按钮）
        function closeBatchRoleModal() {
            document.getElementById('batchRoleModal').classList.remove('show');
        }

        // 弹窗内确定提交：校验角色已选、与勾选用户拼成批量修改请求后跳转
        function submitBatchRole(e) {
            e.preventDefault();
            const roleId = document.getElementById('batch-role-modal-select').value;
            if (!roleId) {
                showToast('请选择要修改的角色', 'error');
                return false;
            }
            const selectedUsers = document.querySelectorAll('.user-checkbox:checked');
            if (selectedUsers.length === 0) {
                showToast('请选择至少一个用户', 'error');
                closeBatchRoleModal();
                return false;
            }
            const userIds = Array.from(selectedUsers).map(cb => cb.value).join(',');
            closeBatchRoleModal();
            window.location.href = 'admin.php?action=user&sub=batchUpdateRole&user_ids=' + userIds + '&role_id=' + roleId;
            return false;
        }
        
        // 导出用户
        function exportUsers(format) {
            const searchParams = new URLSearchParams(window.location.search);
            searchParams.set('action', 'user');
            searchParams.set('sub', 'export');
            searchParams.set('format', format);
            window.location.href = 'admin.php?' + searchParams.toString();
        }
    </script>

    <!-- 批量修改角色弹窗：复用统一 .modal-overlay > .modal 体系（components.css，.show 控制显隐）。
         由工具栏「批量操作 → 批量修改角色」打开（openBatchRoleModal），提交见 submitBatchRole() -->
    <div class="modal-overlay" id="batchRoleModal" onclick="if (event.target === this) closeBatchRoleModal();">
        <div class="modal modal-sm" role="dialog" aria-modal="true" aria-label="批量修改角色">
            <div class="modal-header">
                <h3 class="modal-title">批量修改角色</h3>
                <button type="button" class="modal-close" onclick="closeBatchRoleModal()" aria-label="关闭">&times;</button>
            </div>
            <form onsubmit="return submitBatchRole(event);">
                <div class="modal-body">
                    <!-- ul-batch-role-form-group / ul-batch-role-select：弹窗内表单组去下边距、
                         下拉撑满宽度（components.css，替代原内联样式） -->
                    <div class="form-group ul-batch-role-form-group">
                        <label for="batch-role-modal-select">新角色</label>
                        <select id="batch-role-modal-select" class="filter-select ul-batch-role-select">
                            <option value="">请选择角色</option>
                            <?php foreach ($roleList as $batchRoleId => $batchRoleName): ?>
                            <option value="<?php echo $batchRoleId; ?>"><?php echo htmlspecialchars($batchRoleName); ?></option>
                            <?php endforeach; ?>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeBatchRoleModal()">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>
