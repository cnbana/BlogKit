    <script>
    // ==================== 回收站批量操作 ====================

    // 表头全选/取消全选：与行内复选框状态联动
    document.getElementById('select-all-recycle').addEventListener('change', function() {
        document.querySelectorAll('.recycle-checkbox').forEach(function(cb) {
            cb.checked = this.checked;
        }, this);
    });

    // 批量操作入口：校验勾选后经确认弹窗发起对应批量请求
    function executeRecycleBatch(action) {
        const selected = document.querySelectorAll('.recycle-checkbox:checked');
        if (selected.length === 0) {
            showToast('请选择至少一个用户', 'error');
            return;
        }

        const userIds = Array.from(selected).map(function(cb) { return cb.value; }).join(',');

        // 关闭已打开的下拉菜单（确认弹窗流程不发生页面跳转，需手动收起）
        document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) {
            menu.classList.remove('show');
            const group = menu.closest('.btn-group, .dropdown');
            if (group) group.classList.remove('show');
        });

        if (action === 'batch-restore') {
            showConfirmDialog('确定要恢复选中的' + selected.length + '个用户吗？恢复后账号为禁用状态。', { type: 'info', title: '批量操作', confirmText: '恢复' }).then(function(ok) {
                if (ok) window.location.href = 'admin.php?action=user&method=batchRestore&user_ids=' + userIds;
            });
        } else if (action === 'batch-force-delete') {
            showConfirmDialog('确定要永久删除选中的' + selected.length + '个用户吗？名下有文章的用户将被跳过。此操作不可恢复。', { type: 'danger', title: '批量操作', confirmText: '永久删除' }).then(function(ok) {
                if (ok) window.location.href = 'admin.php?action=user&method=batchForceDelete&user_ids=' + userIds;
            });
        }
    }
    </script>
