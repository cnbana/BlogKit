<!-- 垂直互动区域 -->
<div class="vertical-actions">

        <span class="action-badge">{field name='like_count' filter="cn_number"}</span>
    </button>
    {endif}
    {if config.favorite_enabled}
    <button class="vertical-action-btn favorite-btn {if field='is_favorite'}favorited{/if}" data-article-id="{field name='id'}">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M23.9986 5L17.8856 17.4776L4 19.4911L14.0589 29.3251L11.6544 43L23.9986 36.4192L36.3454 43L33.9586 29.3251L44 19.4911L30.1913 17.4776L23.9986 5Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span class="action-badge">{field name='favorite_count' filter="cn_number"}</span>
    </button>
    {endif}
    <button class="vertical-action-btn comment-btn" data-article-id="{field name='id'}">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M44.0001 24C44.0001 35.0457 35.0458 44 24.0001 44C18.0266 44 4.00006 44 4.00006 44C4.00006 44 4.00006 29.0722 4.00006 24C4.00006 12.9543 12.9544 4 24.0001 4C35.0458 4 44.0001 12.9543 44.0001 24Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 18L32 18" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 26H32" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 34H24" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="action-badge">{field name='comment_count'}</span>
    </button>
    <div class="share-container">
        <button class="vertical-action-btn share-btn" data-article-id="{field name='id'}">
            <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M26 4L44 22L26 39V28C12 28 6 43 6 43C6 26 11 15 26 15V4Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

            </div>
