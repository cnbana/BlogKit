{assign var="page_title" value="公共分页条组件"}
<style>
    /* 分页控件样式 */

    .pagination-info {
        margin-bottom: 12px;
        font-size: var(--font-size-sm);          /* 14px 辅助信息 */
        color: var(--text-muted, #888);
        text-align: center;
    }

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .pagination .page-link {
        border-radius: 4px;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .pagination a.page-link:hover {
        background-color: var(--primary-color, #1890ff);
        border-color: var(--primary-color, #1890ff);
        color: var(--text-invert);
    }

    .pagination .page-link.active {
        background-color: var(--primary-color, #1890ff);
        color: var(--text-invert);
        border-color: var(--primary-color, #1890ff);
        font-weight: 500;
        cursor: default;
    }

    .pagination .page-link.disabled {
        background-color: var(--background-muted, #f5f5f5);
        color: var(--text-muted, #bbb);
        border-color: var(--border-color, #e8e8e8);
        cursor: not-allowed;
    }

    .pagination .ellipsis {
        display: inline-block;
        padding: 0 6px;
        color: var(--text-muted, #bbb);
        font-size: var(--font-size-sm);          /* 14px */
    }
</style>

<div class="pagination-wrapper">
    <div class="pagination-info">
        共 {pagination_info.total} 条记录，第 {pagination_info.current_page} / {pagination_info.total_pages} 页
    </div>
    <div class="pagination-links">{pagination}</div>
</div>
