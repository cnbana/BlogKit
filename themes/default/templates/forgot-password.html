{assign var="page_title" value="忘记密码"}
{include file="header"}

    <!-- 引入验证码样式 -->
    <link rel="stylesheet" href="{site.url}/themes/default/assets/css/captcha.css">
    
    <main class="main-content">
        <div class="container">
            <div class="forgot-container">
                <h2>忘记密码</h2>
                
                {if isset="error"}
                <div class="error-message">
                    {echo value="error"}
                </div>
                {endif}
                
                {if isset="success"}
                <div class="success-message">
                    {echo value="success"}
                </div>
                {endif}
                
                <form action="{url:forgot-password}" method="post" class="forgot-form">
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input type="email" id="email" name="email" required placeholder="请输入您的注册邮箱">
                    </div>
                    
                    <!-- 验证码组件 -->
                    {if captcha_enabled && captcha_forgot_password_enabled}
                    <div class="form-group">
                        <label>验证码</label>
                        <div class="captcha-wrapper" data-captcha-width="{echo value="captcha_width"}" data-captcha-height="{echo value="captcha_height"}" data-captcha-font-size="{echo value="captcha_font_size"}"></div>
                    </div>
                    {endif}
                    
                    <button type="submit" class="submit-btn">发送重置邮件</button>
                </form>
                
                <div class="back-link">
                    <a href="{url:login}">返回登录</a>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 引入验证码脚本 -->
    <script src="{site.url}/themes/default/assets/js/captcha.js"></script>
    
    {include file="footer"}
