{assign var="page_title" value="我的通知"}
{include file="header"}
    
    <main class="main-content">
        <div class="container">
            <div class="profile-container">
                {include file="common/profile_nav.html"}
                
                <div class="profile-content">

                    <!-- 通知设置区域 -->
                    <div class="profile-section">
                    <h3 class="section-title">通知设置</h3>
                    <form method="POST" action="{url:profile}?m=notifications">
                        <input type="hidden" name="action" value="update_notification_settings">
                        
                        <!-- 通知类型开关 -->
                        <div style="margin-bottom: 30px;">
                            <h4 style="margin-bottom: 15px; color: var(--text-secondary);">通知类型设置</h4>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_comments" name="notification_types[comments]" value="1" {if isset="notification_settings.types.comments"}checked{/if}>
                                    <label for="notification_comments" style="font-weight: 500;">评论通知</label>
                                    <small style="color: var(--text-muted);">(文章被评论、评论被回复)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_follows" name="notification_types[follows]" value="1" {if isset="notification_settings.types.follows"}checked{/if}>
                                    <label for="notification_follows" style="font-weight: 500;">关注通知</label>
                                    <small style="color: var(--text-muted);">(被用户关注)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_system" name="notification_types[system]" value="1" {if isset="notification_settings.types.system"}checked{/if}>
                                    <label for="notification_system" style="font-weight: 500;">系统通知</label>
                                    <small style="color: var(--text-muted);">(系统更新、重要公告)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_articles" name="notification_types[articles]" value="1" {if isset="notification_settings.types.articles"}checked{/if}>
                                    <label for="notification_articles" style="font-weight: 500;">文章通知</label>
                                    <small style="color: var(--text-muted);">(文章状态变更、审核结果)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_article_likes" name="notification_types[article_likes]" value="1" {if isset="notification_settings.types.article_likes"}checked{/if}>
                                    <label for="notification_article_likes" style="font-weight: 500;">文章点赞通知</label>
                                    <small style="color: var(--text-muted);">(文章被点赞)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_comment_likes" name="notification_types[comment_likes]" value="1" {if isset="notification_settings.types.comment_likes"}checked{/if}>
                                    <label for="notification_comment_likes" style="font-weight: 500;">评论点赞通知</label>
                                    <small style="color: var(--text-muted);">(评论被点赞)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_favorites" name="notification_types[favorites]" value="1" {if isset="notification_settings.types.favorites"}checked{/if}>
                                    <label for="notification_favorites" style="font-weight: 500;">收藏通知</label>
                                    <small style="color: var(--text-muted);">(文章被收藏)</small>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--bg-secondary); border-radius: 6px;">
                                    <input type="checkbox" id="notification_reviews" name="notification_types[reviews]" value="1" {if isset="notification_settings.types.reviews"}checked{/if}>
                                    <label for="notification_reviews" style="font-weight: 500;">审核通知</label>
                                    <small style="color: var(--text-muted);">(文章/评论审核结果)</small>
                                </div>
                            </div>
                        </div>
                        

                        
                        <!-- 保存按钮 -->
                            <div style="margin-top: 30px;">
                                <button type="submit" style="padding: 10px 20px; background-color: var(--primary-color); color: var(--text-invert); border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">保存设置</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
{include file="footer"}
