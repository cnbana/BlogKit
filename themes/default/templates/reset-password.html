{assign var="page_title" value="重置密码"}
{include file="header"}

    <!-- 引入验证码样式 -->
    <link rel="stylesheet" href="{site.url}/themes/default/assets/css/captcha.css">
    
    <main class="main-content">
        <div class="container">
            <div class="reset-container">
                <h2>重置密码</h2>
                
                {if isset="error"}
                <div class="error-message">
                    {echo value="error"}
                </div>
                {endif}
                
                {if isset="success"}
                <div class="success-message">
                    {echo value="success"}
                </div>
                {endif}
                
                {if isset="info"}
                <div class="info-message">
                    {echo value="info"}
                </div>
                {endif}
                
                <form action="{url:reset-password}" method="post" class="reset-form">
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input type="email" id="email" name="email" required placeholder="请输入您的注册邮箱" autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="token">重置令牌</label>
                        <input type="text" id="token" name="token" required placeholder="请输入邮件中的重置令牌">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">新密码</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" required placeholder="请输入新密码（至少6位）" minlength="6" autocomplete="new-password">
                            <!-- 眼睛图标按钮：切换行为由 main.js initPasswordToggles() 统一绑定 -->
                            <button type="button" class="toggle-password" aria-label="显示密码"><svg viewBox="64 64 896 896" focusable="false" data-icon="eye" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M942.2 486.2C847.4 286.5 704.1 186 512 186c-192.2 0-335.4 100.5-430.2 300.3a60.3 60.3 0 000 51.5C176.6 737.5 319.9 838 512 838c192.2 0 335.4-100.5 430.2-300.3 7.7-16.2 7.7-35 0-51.5zM512 766c-161.3 0-279.4-81.8-362.7-254C232.6 339.8 350.7 258 512 258c161.3 0 279.4 81.8 362.7 254C791.5 684.2 673.4 766 512 766zm-4-430c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176-78.8-176-176-176zm0 288c-61.9 0-112-50.1-112-112s50.1-112 112-112 112 50.1 112 112-50.1 112-112 112z"></path></svg></button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">确认新密码</label>
                        <div class="password-container">
                            <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入新密码" minlength="6" autocomplete="new-password">
                            <button type="button" class="toggle-password" aria-label="显示密码"><svg viewBox="64 64 896 896" focusable="false" data-icon="eye" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M942.2 486.2C847.4 286.5 704.1 186 512 186c-192.2 0-335.4 100.5-430.2 300.3a60.3 60.3 0 000 51.5C176.6 737.5 319.9 838 512 838c192.2 0 335.4-100.5 430.2-300.3 7.7-16.2 7.7-35 0-51.5zM512 766c-161.3 0-279.4-81.8-362.7-254C232.6 339.8 350.7 258 512 258c161.3 0 279.4 81.8 362.7 254C791.5 684.2 673.4 766 512 766zm-4-430c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176-78.8-176-176-176zm0 288c-61.9 0-112-50.1-112-112s50.1-112 112-112 112 50.1 112 112-50.1 112-112 112z"></path></svg></button>
                        </div>
                    </div>
                    
                    <!-- 验证码组件 -->
                    {if captcha_enabled && captcha_reset_enabled}
                    <div class="form-group">
                        <label>验证码</label>
                        <div class="captcha-wrapper" data-captcha-width="{echo value="captcha_width"}" data-captcha-height="{echo value="captcha_height"}" data-captcha-font-size="{echo value="captcha_font_size"}"></div>
                    </div>
                    {endif}
                    
                    <button type="submit" class="submit-btn">重置密码</button>
                </form>
                
                <div class="back-link">
                    <a href="{url:login}">返回登录</a>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 引入验证码脚本 -->
    <script src="{site.url}/themes/default/assets/js/captcha.js"></script>

    <!-- 密码显隐切换已由 main.js initPasswordToggles() 统一处理 -->

    {include file="footer"}
